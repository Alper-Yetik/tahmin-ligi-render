<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Üçlü Tahmin Ligi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Düzen: tek sütun, geniş boşluklar. Üstte marka ve sekmeler, ortada maç kartları ya da sıralama,
   sağ altta yuvarlak sohbet düğmesi. Palet: gece sahası yeşili, altın puan vurgusu. */
:root{
  color-scheme:light;
  --bg:#edf1ef; --glow1:rgba(18,184,134,.16); --glow2:rgba(20,120,200,.08);
  --surface:#ffffff; --surface2:#f4f7f5; --ink:#0b1710; --muted:#5a6b62; --line:#dfe7e2;
  --accent:#0b8a57; --accent2:#12b886; --accent-ink:#ffffff; --accent-soft:rgba(11,138,87,.10);
  --gold:#a86d00; --gold-bg:#fff1cc; --bad:#d23b2e; --field:#f3f6f4;
  --fb:#1b2a6b; --gs:#c4161c; --bjk:#111111;
  --shadow:0 1px 2px rgba(10,30,20,.05),0 10px 30px rgba(10,30,20,.07);
  --shadow-lg:0 24px 60px rgba(10,30,20,.28);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#070f0b; --glow1:rgba(47,209,140,.13); --glow2:rgba(60,120,255,.08);
    --surface:#0e1812; --surface2:#131f19; --ink:#e9f2ed; --muted:#8da298; --line:#1d2c24;
    --accent:#2fd18c; --accent2:#19b6a0; --accent-ink:#04140c; --accent-soft:rgba(47,209,140,.12);
    --gold:#f2c14e; --gold-bg:#33290f; --bad:#ff6b5e; --field:#0b130f;
    --fb:#7d92ff; --gs:#ff5a60; --bjk:#dedede;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px rgba(0,0,0,.40);
    --shadow-lg:0 24px 70px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  background-color:var(--bg);
  background-image:radial-gradient(900px 420px at 88% -8%,var(--glow1),transparent 62%),radial-gradient(760px 380px at -8% 4%,var(--glow2),transparent 60%);
  background-repeat:no-repeat;min-height:100vh;
  padding-inline:16px;padding-block:22px 110px;
}
.wrap{max-width:780px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sub{color:var(--muted);margin:3px 0 0;font-size:.88rem}

/* ---------- üst alan ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 16px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--accent-ink);background:linear-gradient(140deg,var(--accent),var(--accent2));box-shadow:0 8px 20px rgba(18,184,134,.28)}
.logo svg{width:28px;height:28px}
h1{font-size:2.15rem;line-height:.95;letter-spacing:.015em;text-transform:uppercase;font-weight:700}
.me{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:.85rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;box-shadow:var(--shadow)}
.me b{color:var(--ink);font-weight:700}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:.84rem;font-weight:600}
a.link{display:inline}

/* ---------- sekmeler ---------- */
.tabs{display:flex;gap:4px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);align-self:flex-start;max-width:100%;overflow-x:auto}
.tab{background:none;border:0;padding:9px 20px;border-radius:999px;font-family:var(--display);font-size:1.12rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 16px rgba(18,184,134,.28)}

/* ---------- filtre ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:.85rem;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.fb{background:var(--fb)} .dot.gs{background:var(--gs)} .dot.bjk{background:var(--bjk);box-shadow:0 0 0 1px var(--line)}

/* ---------- maç kartları ---------- */
.sec{font-size:1.02rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px;font-weight:700}
.sec.live{color:var(--bad)}
.list{display:flex;flex-direction:column;gap:14px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;font-size:.8rem;color:var(--muted)}
.comp{display:inline-block;font-weight:800;letter-spacing:.09em;text-transform:uppercase;font-size:.68rem;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.comp.ucl{background:rgba(70,110,255,.13);color:#4b6bff}
.comp.uel{background:rgba(255,140,40,.15);color:#d9731a}
.comp.uecl{background:rgba(40,190,150,.15);color:#17a581}
.comp.cup{background:rgba(190,120,255,.15);color:#9b59e8}
@media (prefers-color-scheme: dark){.comp.ucl{color:#8fa4ff}.comp.uel{color:#ffab5e}.comp.uecl{color:#4fe0b8}.comp.cup{color:#c79bff}}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.team{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1.05;min-width:0;overflow-wrap:anywhere}
.team.away{justify-content:flex-end;text-align:right}
.score{display:flex;align-items:center;gap:7px;font-family:var(--display);font-size:1.6rem;font-weight:700;color:var(--muted)}
.score input{width:3.3rem;height:3rem;text-align:center;font-family:var(--display);font-size:1.7rem;font-weight:700;background:var(--field);border:1.5px solid var(--line);border-radius:14px;font-variant-numeric:tabular-nums;-moz-appearance:textfield;color:var(--ink)}
.score input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.score input::-webkit-outer-spin-button,.score input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.score input:disabled{opacity:.6}
.final{font-variant-numeric:tabular-nums;background:var(--ink);color:var(--bg);padding:4px 16px;border-radius:14px;letter-spacing:.06em;font-size:1.7rem}
.final.livefinal{background:linear-gradient(135deg,#e5392b,#ff6b5e);color:#fff;box-shadow:0 8px 20px rgba(229,57,43,.3)}
.score.livecol{flex-direction:column;gap:5px}
.livemin{font-family:var(--display);font-size:1.05rem;font-weight:700;letter-spacing:.05em;color:var(--bad);font-variant-numeric:tabular-nums;min-height:1.2em}
.livebadge{color:var(--bad);font-weight:800;letter-spacing:.06em}
.liveadd{font-size:.72rem;font-weight:700;letter-spacing:.04em;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap}
.teamwrap{display:flex;flex-direction:column;gap:5px;min-width:0}
.teamwrap.away{align-items:flex-end}
.cards{display:flex;gap:10px;min-height:0}
.cards:empty{display:none}
.subtabs{display:flex;gap:8px}
.subtab{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-family:var(--display);font-size:1.05rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.subtab:hover{color:var(--ink)}
.subtab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.evs{display:flex;flex-direction:column;gap:4px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.82rem}
.ev{display:flex;align-items:center;gap:6px;min-width:0;max-width:calc(50% - 7px)}
.ev.away{margin-left:auto;flex-direction:row-reverse;justify-content:flex-start;text-align:right}
.ev b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev .min{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev .gi{font-size:.9rem;line-height:1}
.livemin.ms{color:var(--muted)}
.std th,.std td{padding:10px 9px}
.std th.l,.std td.l{text-align:left}
.std td.rank{padding-left:12px}
.std td.tm{font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.std td.sp{font-family:var(--display);font-size:1.3rem;font-weight:700}
.std tr.club td{background:var(--accent-soft);font-weight:700}
.livebar{display:grid;gap:6px;margin:0 0 12px}
.liverow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:.9rem}
.liverow .livemin{font-size:.9rem;min-height:0}
.lvs{color:var(--bad);font-weight:800;font-size:.72rem;margin-left:4px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media (max-width:520px){.tab{padding:8px 9px;font-size:.9rem;letter-spacing:.02em}.std .hm{display:none}.std th,.std td{padding:10px 6px}}
.cd{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-weight:700;font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.cd i{display:inline-block;width:11px;height:15px;border-radius:2.5px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.cd i.y{background:#f7c600}
.cd i.r{background:#e5392b}
p.state.live{margin:0}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;min-height:38px;border-top:1px solid var(--line);padding-top:12px}
.state{font-size:.86rem;color:var(--muted)}
.state.ok{color:var(--accent);font-weight:600} .state.warn{color:var(--bad);font-weight:600}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border:0;border-radius:12px;padding:10px 20px;font-weight:700;box-shadow:0 6px 16px rgba(18,184,134,.25)}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);box-shadow:none}
.pts{display:inline-block;background:var(--gold-bg);color:var(--gold);border-radius:999px;padding:3px 12px;font-family:var(--display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.pts.zero{background:var(--field);color:var(--muted)}
.pts.live{outline:1.5px dashed var(--bad);outline-offset:1px}
.others{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:7px 8px}
.pill{display:inline-flex;gap:7px;align-items:baseline;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.82rem}
.pill b{font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.pill .p{color:var(--gold);font-weight:800}

/* ---------- sıralama ---------- */
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:13px 14px;text-align:right;white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left;width:100%}
th:first-child,td:first-child{text-align:center}
thead th{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);font-weight:800}
tbody tr+tr td{border-top:1px solid var(--line)}
tbody tr.mine td{background:var(--accent-soft);font-weight:700}
td.rank{font-family:var(--display);font-size:1.2rem;font-weight:700;color:var(--muted)}
td.total{font-family:var(--display);font-size:1.6rem;font-weight:700}
.medal{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-family:var(--display);font-size:1.15rem;font-weight:700;color:#2a1c00}
.medal.m1{background:linear-gradient(140deg,#ffe08a,#e8a921)}
.medal.m2{background:linear-gradient(140deg,#f0f3f5,#aab4bd);color:#1c242a}
.medal.m3{background:linear-gradient(140deg,#f3c39b,#c4824a);color:#2b1704}

/* ---------- kurallar ve genel kutular ---------- */
.rules{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;font-size:.9rem;box-shadow:var(--shadow)}
.rules h3{font-size:1.15rem;letter-spacing:.1em;text-transform:uppercase}
.rules div{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.rules div b{font-family:var(--display);font-size:1.1rem;color:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:34px 20px;text-align:center;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.03em;min-width:0}
label input,label select{background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink);width:100%;min-width:0;font-weight:500}
label input:focus,label select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.adminrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.adminrow input{width:3.2rem;text-align:center;background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:8px;font-variant-numeric:tabular-nums}
.adminrow .grow{flex:1}
.pagefoot{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;font-size:.8rem;color:var(--muted)}
[hidden]{display:none!important}

/* ---------- sağ alttaki sohbet ---------- */
.chatfab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--accent-ink);background:linear-gradient(140deg,var(--accent),var(--accent2));box-shadow:0 14px 34px rgba(18,184,134,.42),0 2px 6px rgba(0,0,0,.25);z-index:60}
.chatfab:hover{transform:translateY(-2px) scale(1.03)}
.chatfab svg{width:28px;height:28px;grid-area:1/1}
.chatfab .i-close{display:none}
.chatfab[aria-expanded="true"] .i-chat{display:none}
.chatfab[aria-expanded="true"] .i-close{display:block}
.chatbadge{position:absolute;top:-5px;right:-5px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--bad);color:#fff;font-size:.74rem;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.chatpanel{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(92px + env(safe-area-inset-bottom));width:min(390px,calc(100vw - 32px));height:min(580px,calc(100dvh - 128px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-lg);overflow:hidden;z-index:60}
.chathead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent2))}
.chathead b{display:block;font-family:var(--display);font-size:1.4rem;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.chathead span{font-size:.78rem;opacity:.85}
.chatx{background:rgba(255,255,255,.2);border:0;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;color:inherit;font-size:1.2rem;line-height:1}
.chatlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--bg);overscroll-behavior:contain}
.chatlist .state{text-align:center;margin:auto}
.msg{align-self:flex-start;max-width:86%;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;overflow-wrap:anywhere;min-width:0;box-shadow:var(--shadow)}
.msg.mine{align-self:flex-end;border-radius:16px 16px 4px 16px;border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink)}
.msg .who{font-family:var(--display);font-weight:700;font-size:1.02rem;letter-spacing:.03em}
.msg .t{opacity:.65;font-size:.72rem;font-variant-numeric:tabular-nums}
.msg.mine .link{color:inherit}
.chatfoot{padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.chatform{display:flex;gap:8px;align-items:center}
.chatform input{flex:1;min-width:0;background:var(--field);border:1.5px solid var(--line);border-radius:999px;padding:11px 16px}
.chatform input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.chatsend{flex:none;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent2))}
.chatsend:disabled{opacity:.45}
.chatsend svg{width:20px;height:20px}
#chatErr{min-height:1.1em;font-size:.78rem}

@media (max-width:520px){
  body{padding-inline:14px}
  h1{font-size:1.75rem}
  .logo{width:40px;height:40px;border-radius:12px}
  .team{font-size:1.02rem;gap:6px;overflow-wrap:break-word;hyphens:auto}
  .team .dot{width:8px;height:8px}
  .board{gap:6px}
  .score{gap:4px}
  .score input{width:2.5rem;height:2.6rem;font-size:1.45rem;border-radius:12px}
  .final{font-size:1.45rem;padding:3px 12px}
  .match{padding:14px}
  .tab{padding:8px 15px}
  .chatpanel{right:8px;left:8px;width:auto;bottom:calc(88px + env(safe-area-inset-bottom));height:min(70dvh,560px)}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.chatfab,.chip,.tab{transition:filter .15s,transform .15s,background-color .15s,color .15s}
  .livebadge{animation:pulse 1.6s ease-in-out infinite}
  .chatpanel{animation:pop .18s ease-out}
  @keyframes pulse{50%{opacity:.45}}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap" lang="tr">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.2l3.6 2.6-1.4 4.2H9.8L8.4 9.8z"/><path d="M12 7.2V2.8M15.6 9.8l4.1-1.3M14.2 14l2.6 3.5M9.8 14l-2.6 3.5M8.4 9.8L4.3 8.5"/></svg></span>
      <div>
        <h1>Üçlü Tahmin Ligi</h1>
        <p class="sub">Fenerbahçe, Galatasaray ve Beşiktaş: Lig ve Avrupa maçları</p>
      </div>
    </div>
    <div class="me" id="me" hidden></div>
  </header>

  <form id="loginbox" class="panel" hidden>
    <div>
      <h2 style="font-size:1.6rem">Adını yaz</h2>
      <p class="sub">Tahminlerin ve puanın bu isimle görünür. Her gün aynı ismi yaz.</p>
    </div>
    <div class="fields">
      <label for="loginNick">Adın<input id="loginNick" maxlength="24" autocomplete="nickname"></label>
    </div>
    <div class="foot"><span class="state" id="loginMsg"></span><button class="btn" type="submit" id="loginBtn">Kaydet</button></div>
  </form>

  <form id="adminbox" class="panel" hidden>
    <h2 style="font-size:1.6rem">Yönetici girişi</h2>
    <div class="fields"><label for="adminPass">Yönetici şifresi<input id="adminPass" type="password" autocomplete="off"></label></div>
    <div class="foot"><span class="state" id="adminMsg"></span><span><button class="btn ghost" type="button" id="adminCancel">Vazgeç</button> <button class="btn" type="submit">Giriş</button></span></div>
  </form>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="matches" aria-selected="true">Maçlar</button>
    <button class="tab" role="tab" data-tab="board" aria-selected="false">Sıralama</button>
    <button class="tab" role="tab" data-tab="super" aria-selected="false">Süper Lig</button>
    <button class="tab" role="tab" data-tab="euro" aria-selected="false">Avrupa</button>
    <button class="tab" role="tab" data-tab="admin" aria-selected="false" id="adminTab" hidden>Yönetim</button>
  </div>

  <main id="view"></main>

  <div class="pagefoot">
    <span>Saatler Türkiye saatidir (TSİ).</span>
    <span><button class="link" id="adminLink" type="button">Yönetici girişi</button><button class="link" id="adminOut" type="button" hidden>Yönetici çıkışı</button></span>
  </div>
</div>

<button class="chatfab" id="chatFab" type="button" aria-label="Sohbeti aç" aria-expanded="false" aria-controls="chatPanel">
  <svg class="i-chat" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4A2.5 2.5 0 0 1 4 13.5z"/></svg>
  <svg class="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  <span class="chatbadge" id="chatBadge" hidden>0</span>
</button>
<section class="chatpanel" id="chatPanel" role="dialog" aria-label="Sohbet" hidden>
  <div class="chathead">
    <div><b>Sohbet</b><span>Maç günü sohbeti</span></div>
    <button class="chatx" id="chatClose" type="button" aria-label="Sohbeti kapat">&times;</button>
  </div>
  <div id="chatlist" class="chatlist" aria-live="polite"></div>
  <div id="chatfoot" class="chatfoot"></div>
</section>

<script src="config.js"></script>
<script>
(function(){
  var CFG=window.TAHMIN_CONFIG||{}, BASE=(CFG.SUPABASE_URL||"").replace(/\/+$/,""), KEY=CFG.SUPABASE_ANON_KEY||"";
  var TEAMS=[{key:"fb",name:"Fenerbahçe"},{key:"gs",name:"Galatasaray"},{key:"bjk",name:"Beşiktaş"}];
  var COMPS=["Süper Lig","Şampiyonlar Ligi","Avrupa Ligi","Konferans Ligi","Türkiye Kupası","Süper Kupa"];
  var EXACT=5, DIFF=3, SIDE=2;
  var ERR={
    invalid_nick:"Ad 2 ile 24 karakter arasında olmalı.",
    unknown_player:"Adın kayıtlı değil, önce adını yaz.",
    invalid_score:"Skor 0 ile 30 arasında olmalı.",
    no_match:"Bu maç artık yok.",
    closed:"Maç başladı, tahmin süresi doldu.",
    already_predicted:"Bu maça zaten tahmin girmişsin.",
    wrong_admin:"Yönetici şifresi yanlış.",
    too_fast:"Çok hızlı yazıyorsun, birkaç saniye bekle.",
    busy:"Sohbet şu an çok yoğun, biraz sonra tekrar dene.",
    invalid_body:"Mesaj 1 ile 300 karakter arasında olmalı."
  };

  var auth=null, adminPass=null, loading=true, loadError="";
  var BOT="uclu_tahmin_bot", tgLinked={};
  var matches=[], preds={}, players={}, lastSig="";
  var stand={}, standAt=0, standBusy=false, standSig="", euro="ucl";
  var tab="matches", filter="all", sub="up", drafts={}, flash={}, pendingDelete=null;
  var el=function(id){return document.getElementById(id)};
  var isAdmin=function(){return !!adminPass};

  /* ---------- depolama ve ağ ---------- */
  function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
  function ssGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
  function ssSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
  function ssDel(k){try{sessionStorage.removeItem(k)}catch(e){}}

  async function sb(path,opts){
    var h={apikey:KEY,"Content-Type":"application/json"};
    if(KEY.indexOf("eyJ")===0)h.Authorization="Bearer "+KEY;
    var r=await fetch(BASE+path,Object.assign({headers:h},opts||{}));
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }
  function rpc(name,args){return sb("/rest/v1/rpc/"+name,{method:"POST",body:JSON.stringify(args)})}

  /* ---------- yardımcılar ---------- */
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function teamKey(n){var t=TEAMS.find(function(t){return t.name.toLowerCase()===String(n).trim().toLowerCase()});return t?t.key:""}
  /* cards verilirse (boş metin de olabilir) takım adının üstüne kart satırı konur. */
  function teamHtml(n,cls,cards){
    var k=teamKey(n);
    var inner='<div class="team '+(cls||"")+'">'+(cls==="away"?esc(n)+'<span class="dot '+k+'"></span>':'<span class="dot '+k+'"></span>'+esc(n))+'</div>';
    if(cards===undefined)return inner;
    return '<div class="teamwrap '+(cls||"")+'"><div class="cards">'+cards+'</div>'+inner+'</div>';
  }
  function cardsHtml(y,r){
    var h="";
    if(y>0)h+='<span class="cd" title="'+y+' sarı kart" aria-label="'+y+' sarı kart"><i class="y"></i>'+y+'</span>';
    if(r>0)h+='<span class="cd" title="'+r+' kırmızı kart" aria-label="'+r+' kırmızı kart"><i class="r"></i>'+r+'</span>';
    return h;
  }
  /* Gol ve kart olayları oyuncu adlarıyla: ev sahibi solda, deplasman sağda, zaman sırasıyla. */
  function evsHtml(m){
    if(!m.ev||!m.ev.length)return "";
    return '<div class="evs">'+m.ev.map(function(e){
      var ic=e.k==="yellow"?'<span class="cd"><i class="y"></i></span>':e.k==="red"?'<span class="cd"><i class="r"></i></span>':'<span class="gi">⚽</span>';
      var note=e.k==="own"?' (k.k.)':e.k==="pen"?' (P)':'';
      return '<div class="ev '+(e.s==="away"?"away":"home")+'">'+ic+'<b>'+esc(e.p||"?")+note+'</b><span class="min">'+esc(fmtMin(e.m))+'</span></div>';
    }).join("")+'</div>';
  }
  function fmtDate(ms){try{return new Date(ms).toLocaleString("tr-TR",{timeZone:"Europe/Istanbul",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
  var LOCK_MS=5*3600*1000;
  function started(m){return Date.now()>=m.kickoff}
  function closed(m){return Date.now()>=m.kickoff-LOCK_MS}
  function fmtTime(ms){try{return new Date(ms).toLocaleString("tr-TR",{timeZone:"Europe/Istanbul",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
  function finished(m){return typeof m.hs==="number"&&typeof m.as==="number"}
  function sgn(n){return n>0?1:n<0?-1:0}
  /* Canlı skor: Raspberry her dakika yazar. 10 dakikadır güncellenmediyse eski sayılır. */
  function isLive(m){
    return !finished(m)&&typeof m.lh==="number"&&typeof m.la==="number"&&(m.lst==="live"||m.lst==="ht"||m.lst==="ft")&&started(m)&&Date.now()-m.lupd<10*60*1000;
  }
  /* Bitti diye işaretlenmiş ama kesin skoru henüz yazılmamış maç: son canlı skor geçici sonuç sayılır. */
  function provisional(m){return !finished(m)&&!isLive(m)&&started(m)&&m.lst==="ft"&&typeof m.lh==="number"&&typeof m.la==="number"}
  function effRes(m){
    if(finished(m))return {hs:m.hs,as:m.as,live:false};
    if(isLive(m)||provisional(m))return {hs:m.lh,as:m.la,live:true};
    return null;
  }
  function liveLabel(m){return m.lst==="ht"?"DEVRE ARASI":m.lst==="ft"?"MAÇ BİTTİ":"CANLI"}
  /* "45'+2'" ya da "45+2" gibi uzatma dakikalarını "45+2'" biçimine çevirir. */
  function fmtMin(s){
    s=String(s||"").trim();
    var x=s.match(/^(\d+)\s*'?\s*\+\s*(\d+)\s*'?$/);
    if(x)return x[1]+"+"+x[2]+"'";
    x=s.match(/^(\d+)\s*'?$/);
    if(x)return x[1]+"'";
    return s;
  }
  function liveMinute(m){return m.lst==="ht"?"Devre arası":m.lst==="ft"?"MS":fmtMin(m.lmin)}
  function score(p,m){
    var r=effRes(m);
    if(!p||!r)return null;
    if(p.h===r.hs&&p.a===r.as)return EXACT;
    if(sgn(p.h-p.a)!==sgn(r.hs-r.as))return 0;
    return (p.h-p.a===r.hs-r.as)?DIFF:SIDE;
  }
  function compCls(c){return {"Şampiyonlar Ligi":"ucl","Avrupa Ligi":"uel","Konferans Ligi":"uecl","Türkiye Kupası":"cup","Süper Kupa":"cup"}[c]||""}
  function nameOf(id){return players[id]||"Oyuncu"}
  function predFor(mid,id){return preds[mid+"_"+id]}
  function countPreds(mid){var n=0;for(var k in preds)if(preds[k].m===mid)n++;return n}

  /* ---------- veri yükleme ---------- */
  async function load(){
    try{
      var r=await Promise.all([
        sb("/rest/v1/matches?select=*&order=kickoff.asc"),
        sb("/rest/v1/predictions?select=*"),
        sb("/rest/v1/players_public?select=*"),
        sb("/rest/v1/players_telegram?select=player_id").catch(function(){return []})
      ]);
      var sig=JSON.stringify(r);
      loadError="";
      if(sig!==lastSig||loading){
        lastSig=sig;
        matches=r[0].map(function(x){return {id:x.id,home:x.home,away:x.away,comp:x.comp,kickoff:Date.parse(x.kickoff),hs:x.home_score,as:x.away_score,lh:x.live_home,la:x.live_away,lmin:x.live_minute,lst:x.live_state,lupd:x.live_updated?Date.parse(x.live_updated):0,ladd:x.live_added,hy:x.home_yellow,hr:x.home_red,ay:x.away_yellow,ar:x.away_red,ev:Array.isArray(x.live_events)?x.live_events:[]}});
        preds={};r[1].forEach(function(x){preds[x.match_id+"_"+x.player_id]={m:x.match_id,u:x.player_id,h:x.h,a:x.a}});
        players={};r[2].forEach(function(x){players[x.id]=x.nick});
        tgLinked={};r[3].forEach(function(x){tgLinked[x.player_id]=1});
        loading=false;render();
      }
    }catch(e){
      loadError="Veriler yüklenemedi. İnternetini kontrol edip sayfayı yenile.";
      loading=false;render();
    }
  }

  /* ---------- görünüm ---------- */
  function render(){
    var active=document.activeElement, aid=active&&active.id, s0=active&&active.selectionStart;
    renderHead();
    document.querySelectorAll(".tab").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.tab===tab))});
    el("adminTab").hidden=!isAdmin();
    el("adminLink").hidden=isAdmin();el("adminOut").hidden=!isAdmin();
    var v=el("view");
    if(!BASE||!KEY)v.innerHTML='<div class="empty"><b>Site henüz bağlanmadı.</b><br>config.js dosyasına Supabase adresini ve anahtarını yaz.</div>';
    else if(loading)v.innerHTML='<div class="empty">Yükleniyor…</div>';
    else if(loadError)v.innerHTML='<div class="empty">'+esc(loadError)+'</div>';
    else if(tab==="board")v.innerHTML=boardHtml();
    else if(tab==="super"||tab==="euro"){v.innerHTML=standingsHtml();ensureStandings()}
    else if(tab==="admin"&&isAdmin())v.innerHTML=adminHtml();
    else v.innerHTML=matchesHtml();
    renderChatFoot();updateChatUI(false);
    if(aid){var n=document.getElementById(aid);if(n&&n!==document.activeElement){n.focus();try{if(s0!=null)n.setSelectionRange(s0,s0)}catch(e){}}}
  }
  function renderHead(){
    var me=el("me");
    el("loginbox").hidden=!!auth||!BASE||!KEY;
    if(!auth){me.hidden=true;return}
    me.hidden=false;
    var tg=tgLinked[auth.id]?'<span class="state ok">Telegram hatırlatması açık</span>':'<a class="link" target="_blank" rel="noopener" href="https://t.me/'+BOT+'?start='+encodeURIComponent(auth.id)+'">Telegram\'dan hatırlat</a>';
    me.innerHTML='<span>Oynayan: <b>'+esc(auth.nick)+'</b></span> <button class="link" data-action="logout">adı değiştir</button> · <button class="link" data-action="signout">çıkış yap</button> · '+tg;
  }

  function filterChips(){
    var h='<div class="chips"><button class="chip" data-filter="all" aria-pressed="'+(filter==="all")+'">Hepsi</button>';
    TEAMS.forEach(function(t){h+='<button class="chip" data-filter="'+t.key+'" aria-pressed="'+(filter===t.key)+'"><span class="dot '+t.key+'"></span>'+t.name+'</button>'});
    return h+'</div>';
  }
  function rulesHtml(){
    return '<div class="rules"><h3>Puanlama</h3>'+
      '<div><span>Skoru tam bildin</span><b>'+EXACT+' puan</b></div>'+
      '<div><span>Galibi ve gol farkını bildin veya beraberliği bildin</span><b>'+DIFF+' puan</b></div>'+
      '<div><span>Galibi bildin ama gol farkı yanlış</span><b>'+SIDE+' puan</b></div>'+
      '<div><span>Yanlış tahmin</span><b>0 puan</b></div>'+
      '<span class="state">Beraberlikte gol farkı hep 0 olduğu için, beraberliği bilen her tahmin (skor farklı olsa bile, örneğin 1-1 yerine 2-2) 3 puan alır. Beraberlik tahmini yapıp galibiyet çıkarsa ya da tersi olursa 0 puan.</span>'+
      '<span class="state">Her maça bir kez tahmin girersin, kaydedince kilitlenir ve değiştirilemez. Tahmin girişi maç başlamadan 5 saat önce kapanır. Herkesin tahmini maç kartında görünür. Skorlar 90 dakika + uzatma sonucudur, penaltılar sayılmaz.</span></div>';
  }

  function matchesHtml(){
    var list=matches.filter(function(m){return filter==="all"||teamKey(m.home)===filter||teamKey(m.away)===filter});
    var liveList=list.filter(isLive).sort(function(a,b){return a.kickoff-b.kickoff});
    var up=list.filter(function(m){return !finished(m)&&!isLive(m)&&!started(m)}).sort(function(a,b){return a.kickoff-b.kickoff});
    var done=list.filter(function(m){return finished(m)||(!isLive(m)&&started(m))}).sort(function(a,b){return b.kickoff-a.kickoff});
    var h=filterChips();
    if(!matches.length){
      h+='<div class="empty"><b>Henüz maç eklenmemiş.</b><br>'+(isAdmin()?'Yönetim sekmesinden ilk maçı ekle.':'Yönetici maçları ekleyince burada tahmin girebileceksin.')+'</div>';
    } else if(!list.length){
      h+='<div class="empty">Bu takım için maç yok.</div>';
    } else {
      if(liveList.length){h+='<h2 class="sec live">Canlı maçlar</h2><div class="list">'+liveList.map(matchCard).join("")+'</div>'}
      h+='<div class="subtabs" role="tablist"><button class="subtab" role="tab" data-sub="up" aria-selected="'+(sub==="up")+'">Oynanacak ('+up.length+')</button><button class="subtab" role="tab" data-sub="done" aria-selected="'+(sub==="done")+'">Oynanan ('+done.length+')</button></div>';
      var cur=sub==="done"?done:up;
      h+=cur.length?'<div class="list">'+cur.map(matchCard).join("")+'</div>':'<div class="empty">'+(sub==="done"?"Henüz oynanan maç yok.":"Oynanacak maç yok.")+'</div>';
    }
    return h+rulesHtml();
  }

  function matchCard(m){
    var mine=auth?predFor(m.id,auth.id):null, locked=closed(m)||!auth||!!mine, fin=finished(m), lv=isLive(m), pv=provisional(m);
    var d=drafts[m.id]||{};
    var hv=d.h!==undefined?d.h:(mine?mine.h:""), av=d.a!==undefined?d.a:(mine?mine.a:"");
    var center;
    if(fin){
      center='<div class="score livecol"><span class="final">'+m.hs+' - '+m.as+'</span><span class="livemin ms">MS</span></div>';
    } else if(pv){
      center='<div class="score livecol"><span class="final">'+m.lh+' - '+m.la+'</span><span class="livemin">MS · kesinleşmedi</span></div>';
    } else if(lv){
      center='<div class="score livecol"><span class="final livefinal">'+m.lh+' - '+m.la+'</span><span class="livemin">'+esc(liveMinute(m))+'</span>'+(m.lst==="live"&&m.ladd>0?'<span class="liveadd">Uzatma: '+m.ladd+' dk</span>':'')+'</div>';
    } else {
      center='<div class="score"><input id="h_'+esc(m.id)+'" data-m="'+esc(m.id)+'" data-side="h" type="number" inputmode="numeric" min="0" max="30" value="'+esc(hv)+'" '+(locked?"disabled":"")+' aria-label="'+esc(m.home)+' gol tahmini">'+
        '<span>-</span><input id="a_'+esc(m.id)+'" data-m="'+esc(m.id)+'" data-side="a" type="number" inputmode="numeric" min="0" max="30" value="'+esc(av)+'" '+(locked?"disabled":"")+' aria-label="'+esc(m.away)+' gol tahmini"></div>';
    }
    var foot="", f=flash[m.id];
    if(fin){
      var pt=score(mine,m);
      foot='<div class="foot">'+(mine?'<span class="state">Tahminin: <b>'+mine.h+' - '+mine.a+'</b></span> <span class="pts '+(pt?"":"zero")+'">+'+pt+'</span>':'<span class="state">Tahmin girmedin</span>')+'</div>';
    } else if(lv){
      var lpt=score(mine,m);
      foot='<div class="foot">'+(mine?'<span class="state">Tahminin: <b>'+mine.h+' - '+mine.a+'</b></span> <span class="pts live '+(lpt?"":"zero")+'">+'+lpt+' şimdilik</span>':'<span class="state">Tahmin girmedin</span>')+'</div>';
    } else if(pv){
      var ppt=score(mine,m);
      foot='<div class="foot">'+(mine?'<span class="state">Tahminin: <b>'+mine.h+' - '+mine.a+'</b></span> <span class="pts '+(ppt?"":"zero")+'">+'+ppt+' (kesinleşmedi)</span>':'<span class="state">Tahmin girmedin</span>')+'</div>';
    } else if(closed(m)){
      foot='<div class="foot">'+(mine?'<span class="state">Tahminin: <b>'+mine.h+' - '+mine.a+'</b> · '+(started(m)?'Maç başladı, sonuç bekleniyor':'Tahminler kapandı')+'</span>':'<span class="state warn">Tahmin süresi doldu (maçtan 5 saat önce kapanır)</span>')+'</div>';
    } else if(!auth){
      foot='<div class="foot"><span class="state">'+countPreds(m.id)+' kişi tahmin girdi</span></div>';
    } else if(mine){
      foot='<div class="foot"><span class="state ok">Tahminin kilitlendi: <b>'+mine.h+' - '+mine.a+'</b>. Değiştirilemez.</span></div>';
    } else {
      var valid=hv!==""&&av!==""&&+hv>=0&&+av>=0&&+hv<=30&&+av<=30;
      var msg=f?'<span class="state warn">'+esc(f)+'</span>':'<span class="state">Kaydedince değiştiremezsin</span>';
      foot='<div class="foot">'+msg+'<button class="btn" data-action="savePred" data-m="'+esc(m.id)+'" '+(valid?"":"disabled")+'>Tahmini kilitle</button></div>';
    }
    var others="";
    var ps=Object.keys(preds).map(function(k){return preds[k]}).filter(function(p){return p.m===m.id});
    if(ps.length){
      others='<div class="others">'+ps.sort(function(a,b){return (score(b,m)||0)-(score(a,m)||0)||nameOf(a.u).localeCompare(nameOf(b.u),"tr")}).map(function(p){
        var pt=score(p,m);
        return '<span class="pill">'+esc(nameOf(p.u))+(auth&&p.u===auth.id?' (sen)':'')+' <b>'+p.h+'-'+p.a+'</b>'+(pt!=null?' <span class="p">+'+pt+'</span>':'')+'</span>';
      }).join("")+'</div>';
    }
    var closing=(!fin&&!closed(m))?' · Tahmin kapanışı: '+fmtDate(m.kickoff-LOCK_MS):'';
    var showCards=fin||lv||pv;
    var badge=lv?'<span class="livebadge">● '+esc(liveLabel(m))+'</span> · ':'';
    return '<article class="match"><div class="meta"><span class="comp '+compCls(m.comp)+'">'+esc(m.comp)+'</span><span>'+badge+fmtDate(m.kickoff)+esc(closing)+'</span></div>'+
      '<div class="board">'+teamHtml(m.home,"",showCards?cardsHtml(m.hy,m.hr):undefined)+center+teamHtml(m.away,"away",showCards?cardsHtml(m.ay,m.ar):undefined)+'</div>'+(showCards?evsHtml(m):"")+foot+others+'</article>';
  }

  /* ---------- puan durumları (Süper Lig, Avrupa kupaları) ---------- */
  var NOTE_TR={"Champions League":"Şampiyonlar Ligi","Champions League qualifying":"Şampiyonlar Ligi eleme","Europa League":"Avrupa Ligi","Europa League qualifying":"Avrupa Ligi eleme","Conference League":"Konferans Ligi","Conference League qualifying":"Konferans Ligi eleme","Europa Conference League qualifying":"Konferans Ligi eleme","Relegation":"Küme düşme","Relegated":"Küme düşme","Relegation playoff":"Küme düşme play-off","Promoted":"Yükselme","Qualifies for knockout phase playoffs":"Play-off","Qualifies for round of 16 playoffs":"Play-off","Qualifies for knockout phase":"Eleme turu","Qualifies for round of 16":"Son 16'ya doğrudan","Knockout phase playoffs":"Play-off","Knockout phase playoffs - seeded":"Play-off (seri başı)","Eliminated":"Elendi"};
  var EURO_ICO={
    ucl:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
    uel:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8 20h8M10 17h4"/></svg>',
    uecl:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15M5 19l8-8"/></svg>'
  };
  function noteTr(n){
    var t=String(n),l=t.toLowerCase();
    if(NOTE_TR[t])return NOTE_TR[t];
    if(/knockout phase play-?offs?/.test(l))return "Play-off"+(/unseeded/.test(l)?" (seri başı olmayan)":/seeded/.test(l)?" (seri başı)":"");
    if(/round of 16/.test(l))return "Son 16'ya doğrudan";
    if(/relegat/.test(l))return "Küme düşme";
    if(/eliminat/.test(l))return "Elendi";
    return t;
  }
  function standLive(){return Object.keys(stand).some(function(k){return (stand[k].data||[]).some(function(r){return r.lv})})}
  /* Canlı maç varken 15 sn'de, yokken 60 sn'de bir yeniler. Veri değişmediyse sayfayı yeniden çizmez. */
  function ensureStandings(){
    if(standBusy||Date.now()-standAt<(standLive()?15000:60000))return;
    standBusy=true;
    sb("/rest/v1/standings?select=*").then(function(rows){
      var sig=JSON.stringify(rows);standAt=Date.now();standBusy=false;
      if(sig!==standSig){standSig=sig;stand={};(rows||[]).forEach(function(r){stand[r.league]=r});render()}
    }).catch(function(){standAt=Date.now()-30000;standBusy=false;if(!standSig){standSig="err";render()}});
  }
  function standingsHtml(){
    var names={super:"Süper Lig",ucl:"Şampiyonlar Ligi",uel:"Avrupa Ligi",uecl:"Konferans Ligi"};
    var key=tab==="super"?"super":euro, h="";
    if(tab==="euro")h+='<div class="chips">'+["ucl","uel","uecl"].map(function(k){return '<button class="chip" data-euro="'+k+'" aria-pressed="'+(euro===k)+'">'+EURO_ICO[k]+names[k]+'</button>'}).join("")+'</div>';
    var compName=names[key], lm=matches.filter(function(m){return m.comp===compName&&isLive(m)});
    if(lm.length)h+='<div class="livebar">'+lm.map(function(m){return '<div class="liverow"><span class="livebadge">● '+liveLabel(m)+'</span> <b>'+esc(m.home)+' '+m.lh+' - '+m.la+' '+esc(m.away)+'</b> <span class="livemin">'+esc(liveMinute(m))+'</span>'+(m.lst==="live"&&m.ladd>0?' <span class="liveadd">Uzatma: '+m.ladd+' dk</span>':'')+'</div>'}).join("")+'</div>';
    var s=stand[key], rows=s&&Array.isArray(s.data)?s.data:[];
    if(!rows.length)return h+'<div class="empty">'+(standAt?'<b>'+names[key]+' puan durumu henüz yok.</b><br>Raspberry Pi üzerindeki <code>sync_standings.py</code> çalışınca burada görünür.':'Yükleniyor…')+'</div>';
    var hex=/^#[0-9a-fA-F]{6}$/, seen={}, legend="";
    if(rows.some(function(r){return r.lv}))h+='<p class="state live"><span class="livebadge">● CANLI</span> Tablo anlık skorlara göre hesaplanıyor, maçlar bitince resmi tabloya döner.</p>';
    h+='<div class="tablebox"><table class="std"><thead><tr><th>#</th><th class="l">Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th class="hm">A</th><th class="hm">Y</th><th>AV</th><th>P</th></tr></thead><tbody>';
    rows.forEach(function(r){
      var k=teamKey(r.t), c=hex.test(r.c||"")?r.c:"";
      if(c&&r.n&&!seen[r.n]){seen[r.n]=1;legend+='<span><i style="background:'+c+'"></i>'+esc(noteTr(r.n))+'</span>'}
      var gd=(+r.gd||0)>0?"+"+r.gd:String(+r.gd||0);
      h+='<tr class="'+(k?"club":"")+'"><td class="rank"'+(c?' style="box-shadow:inset 4px 0 0 '+c+'"':'')+'>'+(+r.r||"")+'</td><td class="l tm">'+(k?'<span class="dot '+k+'"></span> ':'')+esc(r.t)+(r.lv?' <span class="lvs">● '+esc(r.lv)+'</span>':'')+'</td><td>'+(+r.o||0)+'</td><td>'+(+r.w||0)+'</td><td>'+(+r.d||0)+'</td><td>'+(+r.l||0)+'</td><td class="hm">'+(+r.gf||0)+'</td><td class="hm">'+(+r.ga||0)+'</td><td>'+gd+'</td><td class="sp">'+(+r.p||0)+'</td></tr>';
    });
    h+='</tbody></table></div>';
    if(legend)h+='<div class="legend">'+legend+'</div>';
    var yr=+s.season, sez=yr?yr+"-"+String((yr+1)%100).padStart(2,"0"):"";
    h+='<p class="state">'+names[key]+(sez?" "+sez:"")+(s.updated_at?' · Son güncelleme: '+fmtDate(Date.parse(s.updated_at)):'')+'</p>';
    return h;
  }
  function boardHtml(){
    var ids={};Object.keys(players).forEach(function(i){ids[i]=1});
    var mm={};matches.forEach(function(m){mm[m.id]=m});
    var rows=Object.keys(ids).map(function(id){
      var r={id:id,pts:0,exact:0,played:0};
      Object.keys(preds).forEach(function(k){
        var p=preds[k];if(p.u!==id)return;var m=mm[p.m];if(!m)return;
        var s=score(p,m);if(s==null)return;
        r.pts+=s;r.played++;if(s===EXACT)r.exact++;
      });
      return r;
    }).sort(function(a,b){return b.pts-a.pts||b.exact-a.exact||nameOf(a.id).localeCompare(nameOf(b.id),"tr")});
    var doneCount=matches.filter(finished).length, liveCount=matches.filter(isLive).length;
    if(!rows.length)return '<div class="empty"><b>Sıralama boş.</b><br>İlk oyuncular kayıt olunca burada görünecek.</div>'+rulesHtml();
    var h='<div class="tablebox"><table><thead><tr><th>#</th><th>Oyuncu</th><th>Tam skor</th><th>Maç</th><th>Puan</th></tr></thead><tbody>';
    rows.forEach(function(r,i){
      var me=auth&&r.id===auth.id;
      h+='<tr class="'+(me?"mine":"")+'"><td class="rank">'+(i<3&&r.pts>0?'<span class="medal m'+(i+1)+'">'+(i+1)+'</span>':(i+1))+'</td><td>'+esc(nameOf(r.id))+(me?' <span class="state">(sen)</span>':'')+'</td><td>'+r.exact+'</td><td>'+r.played+'</td><td class="total">'+r.pts+'</td></tr>';
    });
    var note=liveCount?'<p class="state live"><span class="livebadge">● CANLI</span> '+liveCount+' maç sürüyor. Puanlar şimdiki skora göre hesaplanıyor, maç bitince kesinleşir.</p>':'';
    return note+h+'</tbody></table></div><p class="state">Bitmiş maç sayısı: '+doneCount+(liveCount?' · Canlı: '+liveCount:'')+'</p>'+rulesHtml();
  }

  function adminHtml(){
    var h='<div class="panel"><h2 style="font-size:1.4rem">Maç ekle</h2><div class="fields">'+
      '<label for="nm_home">Ev sahibi<input id="nm_home" list="teamlist" autocomplete="off" placeholder="Fenerbahçe"></label>'+
      '<label for="nm_away">Deplasman<input id="nm_away" list="teamlist" autocomplete="off" placeholder="Rakip takım"></label>'+
      '<label for="nm_comp">Organizasyon<select id="nm_comp">'+COMPS.map(function(c){return '<option>'+c+'</option>'}).join("")+'</select></label>'+
      '<label for="nm_time">Başlama saati (TSİ)<input id="nm_time" type="datetime-local"></label></div>'+
      '<datalist id="teamlist">'+TEAMS.map(function(t){return '<option value="'+t.name+'">'}).join("")+'</datalist>'+
      '<div class="foot"><span class="state" id="nm_msg"></span><button class="btn" data-action="addMatch">Maçı ekle</button></div></div>';
    h+='<h2 class="sec">Sonuç gir ve maçları yönet</h2>';
    if(!matches.length)return h+'<div class="empty">Henüz maç yok.</div>';
    return h+'<div class="list">'+matches.slice().sort(function(a,b){return a.kickoff-b.kickoff}).map(function(m){
      var del=pendingDelete===m.id, id=esc(m.id);
      return '<div class="match"><div class="meta"><span class="comp">'+esc(m.comp)+'</span><span>'+fmtDate(m.kickoff)+'</span></div>'+
        '<div class="board">'+teamHtml(m.home)+'<div class="score">'+(finished(m)?'<span class="final">'+m.hs+' - '+m.as+'</span>':'<span class="state">-</span>')+'</div>'+teamHtml(m.away,"away")+'</div>'+
        '<div class="adminrow"><input id="rh_'+id+'" type="number" min="0" max="30" inputmode="numeric" value="'+(finished(m)?m.hs:"")+'" aria-label="Ev sahibi gol"> <span>-</span> <input id="ra_'+id+'" type="number" min="0" max="30" inputmode="numeric" value="'+(finished(m)?m.as:"")+'" aria-label="Deplasman gol">'+
        '<button class="btn" data-action="saveResult" data-m="'+id+'">Sonucu kaydet</button>'+
        (finished(m)?'<button class="btn ghost" data-action="clearResult" data-m="'+id+'">Sonucu sil</button>':'')+
        '<span class="grow"></span><button class="btn danger" data-action="delMatch" data-m="'+id+'">'+(del?"Silmek için tekrar bas":"Maçı sil")+'</button></div></div>';
    }).join("")+'</div>';
  }

  /* ---------- sohbet ---------- */
  var chat=[], chatDraft="", chatSeen=+(lsGet("tl_chat_seen")||0), chatBusy=false, chatErr="", chatTick=0, chatOpen=false, chatFootKey="";
  var SEND_SVG='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4l17.4-8.1a.4.4 0 0 0 0-.7L3.4 3.6a.4.4 0 0 0-.56.5l2.3 6.6 8.6 1.3-8.6 1.3-2.3 6.6a.4.4 0 0 0 .56.5z"/></svg>';
  /* Mesaj yazma alanı: giriş durumu değişince yeniden çizilir, yoksa yazı kutusuna dokunmaz. */
  function renderChatFoot(){
    var foot=el("chatfoot");if(!foot)return;
    var key=auth?"in:"+auth.id:"out";
    if(key===chatFootKey)return;
    chatFootKey=key;
    foot.innerHTML=auth?
      '<div class="chatform"><input id="chatInput" maxlength="300" autocomplete="off" placeholder="Mesaj yaz…" value="'+esc(chatDraft)+'" aria-label="Mesaj"><button class="chatsend" id="chatSend" type="button" data-action="sendChat" aria-label="Gönder">'+SEND_SVG+'</button></div><span class="state warn" id="chatErr">'+esc(chatErr)+'</span>':
      '<span class="state">Mesaj yazmak için önce sayfadan adını yaz.</span>';
  }
  function setChatOpen(open){
    chatOpen=!!open;
    el("chatPanel").hidden=!chatOpen;
    var fab=el("chatFab");fab.setAttribute("aria-expanded",String(chatOpen));fab.setAttribute("aria-label",chatOpen?"Sohbeti kapat":"Sohbeti aç");
    if(chatOpen){
      renderChatFoot();
      loadChat().then(function(){updateChatUI(true)});
      updateChatUI(true);
      var inp=el("chatInput");if(inp)setTimeout(function(){inp.focus()},50);
    } else updateChatUI(false);
  }
  function chatListHtml(){
    if(!chat.length)return '<div class="state">Henüz mesaj yok. İlk mesajı sen yaz.</div>';
    return chat.map(function(m){
      var mine=auth&&m.player_id===auth.id;
      return '<div class="msg'+(mine?' mine':'')+'"><span class="who">'+esc(m.nick)+'</span> <span class="t">'+fmtTime(Date.parse(m.created_at))+'</span>'+
        (isAdmin()?' <button class="link" data-action="delChat" data-id="'+m.id+'" aria-label="Mesajı sil">sil</button>':'')+
        '<div>'+esc(m.body)+'</div></div>';
    }).join("");
  }
  function updateChatUI(force){
    var last=chat.length?chat[chat.length-1].id:0;
    if(chatOpen&&last>chatSeen){chatSeen=last;lsSet("tl_chat_seen",last)}
    var box=el("chatlist");
    if(chatOpen&&box){
      var near=force||box.scrollHeight-box.scrollTop-box.clientHeight<80;
      var html=chatListHtml();
      if(box.dataset.sig!==html){box.dataset.sig=html;box.innerHTML=html;if(near)box.scrollTop=box.scrollHeight}
    }
    var unread=chat.filter(function(m){return m.id>chatSeen&&!(auth&&m.player_id===auth.id)}).length;
    var badge=el("chatBadge");
    if(badge){badge.hidden=chatOpen||!unread;badge.textContent=unread>9?"9+":String(unread)}
  }
  async function loadChat(){
    if(!BASE||!KEY)return;
    try{
      var r=await sb("/rest/v1/chat_public?select=*&order=id.desc&limit=100");
      r.reverse();chat=r;
    }catch(e){return}
    updateChatUI(false);
  }
  async function sendChat(){
    var inp=el("chatInput");if(!inp||!auth||chatBusy)return;
    var text=inp.value.trim();if(!text)return;
    chatBusy=true;var btn=el("chatSend");if(btn)btn.disabled=true;
    try{
      var r=await rpc("send_chat",{p_nick:auth.nick,p_body:text});
      if(r.ok){inp.value="";chatDraft="";chatErr=""}
      else chatErr=ERR[r.error]||"Gönderilemedi.";
    }catch(e){chatErr="Bağlantı hatası, tekrar dene."}
    chatBusy=false;
    var b2=el("chatSend");if(b2)b2.disabled=false;
    var er=el("chatErr");if(er)er.textContent=chatErr;
    await loadChat();updateChatUI(true);
  }
  async function delChat(id){
    var r=await adminCall("admin_delete_chat",{p_id:+id});
    if(r&&r.ok)await loadChat();
  }

  /* ---------- işlemler ---------- */
  async function doLogin(e){
    e.preventDefault();
    var nick=el("loginNick").value.trim(), msg=el("loginMsg"), btn=el("loginBtn");
    btn.disabled=true;msg.className="state";msg.textContent="Kaydediliyor…";
    try{
      var r=await rpc("player_login",{p_nick:nick});
      if(!r.ok){msg.className="state warn";msg.textContent=ERR[r.error]||"Kaydedilemedi.";btn.disabled=false;return}
      auth={id:r.id,nick:r.nick};lsSet("tl_auth",auth);msg.textContent="";
      await load();render();
    }catch(err){msg.className="state warn";msg.textContent="Bağlantı hatası, tekrar dene."}
    btn.disabled=false;
  }
  async function savePred(mid){
    if(!auth)return;
    var m=matches.find(function(x){return x.id===mid});if(!m||closed(m)||predFor(mid,auth.id))return;
    var d=drafts[mid]||{}, h=parseInt(d.h,10), a=parseInt(d.a,10);
    if(isNaN(h)||isNaN(a)||h<0||a<0||h>30||a>30)return;
    try{
      var r=await rpc("submit_prediction",{p_nick:auth.nick,p_match:mid,p_h:h,p_a:a});
      if(r.ok){delete drafts[mid];delete flash[mid]}
      else{
        flash[mid]=ERR[r.error]||"Kaydedilemedi.";if(r.error==="closed")flash[mid]="Tahmin süresi doldu (maçtan 5 saat önce kapanır).";
        if(r.error==="unknown_player"){auth=null;lsDel("tl_auth");flash[mid]="Adın bulunamadı, adını tekrar yaz."}
      }
    }catch(e){flash[mid]="Bağlantı hatası, tekrar dene."}
    await load();render();
  }
  async function adminCall(name,args){
    args.p_admin=adminPass;
    try{
      var r=await rpc(name,args);
      if(!r.ok&&r.error==="wrong_admin"){adminPass=null;ssDel("tl_admin");tab="matches";render()}
      return r;
    }catch(e){return {ok:false,error:"net"}}
  }
  async function addMatch(){
    var home=el("nm_home").value.trim(),away=el("nm_away").value.trim(),comp=el("nm_comp").value,t=el("nm_time").value,msg=el("nm_msg");
    if(!home||!away||!t){msg.textContent="Takımları ve başlama saatini doldur.";msg.className="state warn";return}
    var ms=Date.parse(t+":00+03:00");if(isNaN(ms)){msg.textContent="Saat geçersiz.";msg.className="state warn";return}
    var id="m"+ms+"-"+Math.random().toString(36).slice(2,6);
    var r=await adminCall("admin_upsert_match",{p_id:id,p_home:home,p_away:away,p_comp:comp,p_kickoff:new Date(ms).toISOString()});
    if(r.ok){await load();render();var m2=el("nm_msg");if(m2){m2.textContent="Maç eklendi.";m2.className="state ok"}}
    else{msg.textContent="Eklenemedi.";msg.className="state warn"}
  }
  async function saveResult(mid){
    var h=parseInt(el("rh_"+mid).value,10),a=parseInt(el("ra_"+mid).value,10);
    if(isNaN(h)||isNaN(a)||h<0||a<0)return;
    await adminCall("admin_set_result",{p_id:mid,p_hs:h,p_as:a});await load();render();
  }
  async function clearResult(mid){await adminCall("admin_set_result",{p_id:mid,p_hs:null,p_as:null});await load();render()}
  async function delMatch(mid){
    if(pendingDelete!==mid){pendingDelete=mid;render();setTimeout(function(){if(pendingDelete===mid){pendingDelete=null;render()}},4000);return}
    pendingDelete=null;await adminCall("admin_delete_match",{p_id:mid});await load();render();
  }
  async function doAdminLogin(e){
    e.preventDefault();
    var pw=el("adminPass").value,msg=el("adminMsg");msg.className="state";msg.textContent="Kontrol ediliyor…";
    try{
      var r=await rpc("admin_check",{p_admin:pw});
      if(r.ok){adminPass=pw;ssSet("tl_admin",pw);el("adminbox").hidden=true;el("adminPass").value="";msg.textContent="";tab="admin";render()}
      else{msg.className="state warn";msg.textContent=ERR.wrong_admin}
    }catch(err){msg.className="state warn";msg.textContent="Bağlantı hatası."}
  }

  /* ---------- olaylar ---------- */
  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-tab],[data-sub],[data-euro],[data-filter],[data-action]");if(!t)return;
    if(t.dataset.tab){tab=t.dataset.tab;render();return}
    if(t.dataset.euro){euro=t.dataset.euro;render();return}
    if(t.dataset.sub){sub=t.dataset.sub;render();return}
    if(t.dataset.filter){filter=t.dataset.filter;render();return}
    var a=t.dataset.action,m=t.dataset.m;
    if(a==="sendChat")sendChat();
    else if(a==="delChat")delChat(t.dataset.id);
    else if(a==="savePred")savePred(m);
    else if(a==="signout"){auth=null;lsDel("tl_auth");chatFootKey="";render()}
    else if(a==="logout"){var old=auth&&auth.nick;auth=null;lsDel("tl_auth");render();el("loginNick").value=old||"";el("loginNick").focus()}
    else if(a==="addMatch")addMatch();
    else if(a==="saveResult")saveResult(m);
    else if(a==="clearResult")clearResult(m);
    else if(a==="delMatch")delMatch(m);
  });
  document.addEventListener("input",function(e){
    var t=e.target;if(!t.dataset||!t.dataset.m||!t.dataset.side)return;
    var d=drafts[t.dataset.m]||(drafts[t.dataset.m]={});d[t.dataset.side]=t.value;delete flash[t.dataset.m];
    var h=d.h===undefined?"":d.h,a=d.a===undefined?"":d.a;
    var btn=document.querySelector('[data-action="savePred"][data-m="'+t.dataset.m+'"]');
    if(btn)btn.disabled=!(h!==""&&a!==""&&+h>=0&&+a>=0&&+h<=30&&+a<=30);
  });
  document.addEventListener("input",function(e){if(e.target&&e.target.id==="chatInput")chatDraft=e.target.value});
  document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target&&e.target.id==="chatInput"){e.preventDefault();sendChat()}});
  /* Sohbet açıkken 4 saniyede bir, değilken 20 saniyede bir kontrol et (okunmamış sayısı için). */
  setInterval(function(){
    if(document.hidden)return;
    chatTick++;
    if(chatOpen||chatTick%5===0)loadChat();
  },4000);
  el("chatFab").addEventListener("click",function(){setChatOpen(!chatOpen)});
  el("chatClose").addEventListener("click",function(){setChatOpen(false);el("chatFab").focus()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&chatOpen){setChatOpen(false);el("chatFab").focus()}});
  el("loginbox").addEventListener("submit",doLogin);
  el("adminbox").addEventListener("submit",doAdminLogin);
  el("adminLink").addEventListener("click",function(){el("adminbox").hidden=false;el("adminPass").focus()});
  el("adminCancel").addEventListener("click",function(){el("adminbox").hidden=true});
  el("adminOut").addEventListener("click",function(){adminPass=null;ssDel("tl_admin");tab="matches";render()});
  /* Canlı maç varken 15 saniyede bir, yoksa 30 saniyede bir yenile. */
  setInterval(function(){if((tab==="super"||tab==="euro")&&!document.hidden)ensureStandings()},5000);
  (function tick(){
    var a=document.activeElement;
    if(BASE&&KEY&&!document.hidden&&!(a&&a.tagName==="INPUT"))load();
    setTimeout(tick,matches.some(isLive)?15000:30000);
  })();

  /* ---------- başlangıç ---------- */
  var saved=lsGet("tl_auth");if(saved&&saved.id&&saved.nick)auth={id:saved.id,nick:saved.nick};
  var sa=ssGet("tl_admin");if(sa)adminPass=sa;
  render();
  if(BASE&&KEY){load();loadChat()}else loading=false,render();
})();
</script>
</body>
</html>
