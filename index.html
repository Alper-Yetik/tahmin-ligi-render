<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Üçlü Tahmin Ligi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Düzen: tek sütun, geniş boşluklar. Üstte marka ve sekmeler, ortada maç kartları ya da sıralama,
   sağ altta yuvarlak sohbet düğmesi. Palet: gece sahası yeşili, altın puan vurgusu. */
:root{
  color-scheme:light;
  --bg:#edf1ef; --glow1:rgba(18,184,134,.16); --glow2:rgba(20,120,200,.08);
  --surface:#ffffff; --surface2:#f4f7f5; --ink:#0b1710; --muted:#5a6b62; --line:#dfe7e2;
  --accent:#0b8a57; --accent2:#12b886; --accent-ink:#ffffff; --accent-soft:rgba(11,138,87,.10);
  --gold:#a86d00; --gold-bg:#fff1cc; --bad:#d23b2e; --win:#1b8a4b; --field:#f3f6f4;
  --fb:#1b2a6b; --gs:#c4161c; --bjk:#111111;
  --shadow:0 1px 2px rgba(10,30,20,.05),0 10px 30px rgba(10,30,20,.07);
  --shadow-lg:0 24px 60px rgba(10,30,20,.28);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#070f0b; --glow1:rgba(47,209,140,.13); --glow2:rgba(60,120,255,.08);
    --surface:#0e1812; --surface2:#131f19; --ink:#e9f2ed; --muted:#8da298; --line:#1d2c24;
    --accent:#2fd18c; --accent2:#19b6a0; --accent-ink:#04140c; --accent-soft:rgba(47,209,140,.12);
    --gold:#f2c14e; --gold-bg:#33290f; --bad:#ff6b5e; --win:#4ade80; --field:#0b130f;
    --fb:#7d92ff; --gs:#ff5a60; --bjk:#dedede;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px rgba(0,0,0,.40);
    --shadow-lg:0 24px 70px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  background-color:var(--bg);
  background-image:radial-gradient(900px 420px at 88% -8%,var(--glow1),transparent 62%),radial-gradient(760px 380px at -8% 4%,var(--glow2),transparent 60%);
  background-repeat:no-repeat;min-height:100vh;
  padding-inline:16px;padding-block:22px 110px;
}
.wrap{max-width:780px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sub{color:var(--muted);margin:3px 0 0;font-size:.88rem}

/* ---------- üst alan ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 16px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--accent-ink);background:linear-gradient(140deg,var(--accent),var(--accent2));box-shadow:0 8px 20px rgba(18,184,134,.28)}
.logo svg{width:28px;height:28px}
h1{font-size:2.15rem;line-height:.95;letter-spacing:.015em;text-transform:uppercase;font-weight:700}
.me{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:.85rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;box-shadow:var(--shadow)}
.me b{color:var(--ink);font-weight:700}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:.84rem;font-weight:600}
a.link{display:inline}

/* ---------- sekmeler ---------- */
.tabs{display:flex;gap:4px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);align-self:flex-start;max-width:100%;overflow-x:auto}
.tab{background:none;border:0;padding:9px 20px;border-radius:999px;font-family:var(--display);font-size:1.12rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 16px rgba(18,184,134,.28)}

/* ---------- filtre ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:.85rem;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.fb{background:var(--fb)} .dot.gs{background:var(--gs)} .dot.bjk{background:var(--bjk);box-shadow:0 0 0 1px var(--line)}

/* ---------- maç kartları ---------- */
.sec{font-size:1.02rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px;font-weight:700}
.sec.live{color:var(--bad)}
.list{display:flex;flex-direction:column;gap:14px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;font-size:.8rem;color:var(--muted)}
.comp{display:inline-block;font-weight:800;letter-spacing:.09em;text-transform:uppercase;font-size:.68rem;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.comp.ucl{background:rgba(70,110,255,.13);color:#4b6bff}
.comp.uel{background:rgba(255,140,40,.15);color:#d9731a}
.comp.uecl{background:rgba(40,190,150,.15);color:#17a581}
.comp.cup{background:rgba(190,120,255,.15);color:#9b59e8}
@media (prefers-color-scheme: dark){.comp.ucl{color:#8fa4ff}.comp.uel{color:#ffab5e}.comp.uecl{color:#4fe0b8}.comp.cup{color:#c79bff}}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.team{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1.05;min-width:0;overflow-wrap:anywhere}
.team.away{justify-content:flex-end;text-align:right}
.score{display:flex;align-items:center;gap:7px;font-family:var(--display);font-size:1.6rem;font-weight:700;color:var(--muted)}
.score input{width:3.3rem;height:3rem;text-align:center;font-family:var(--display);font-size:1.7rem;font-weight:700;background:var(--field);border:1.5px solid var(--line);border-radius:14px;font-variant-numeric:tabular-nums;-moz-appearance:textfield;color:var(--ink)}
.score input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.score input::-webkit-outer-spin-button,.score input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.score input:disabled{opacity:.6}
.final{font-variant-numeric:tabular-nums;background:var(--ink);color:var(--bg);padding:4px 16px;border-radius:14px;letter-spacing:.06em;font-size:1.7rem}
.final.livefinal{background:linear-gradient(135deg,#e5392b,#ff6b5e);color:#fff;box-shadow:0 8px 20px rgba(229,57,43,.3)}
.score.livecol{flex-direction:column;gap:5px}
.livemin{font-family:var(--display);font-size:1.05rem;font-weight:700;letter-spacing:.05em;color:var(--bad);font-variant-numeric:tabular-nums;min-height:1.2em}
.livebadge{color:var(--bad);font-weight:800;letter-spacing:.06em}
.liveadd{font-size:.72rem;font-weight:700;letter-spacing:.04em;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap}
.teamwrap{display:flex;flex-direction:column;gap:5px;min-width:0}
.teamwrap.away{align-items:flex-end}
.cards{display:flex;gap:10px;min-height:0}
.cards:empty{display:none}
.subtabs{display:flex;gap:8px}
.subtab{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-family:var(--display);font-size:1.05rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.subtab:hover{color:var(--ink)}
.subtab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.evs{display:flex;flex-direction:column;gap:4px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.82rem}
.ev{display:flex;align-items:center;gap:6px;min-width:0;max-width:calc(50% - 7px)}
.ev.away{margin-left:auto;flex-direction:row-reverse;justify-content:flex-start;text-align:right}
.ev b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev .min{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev .gi{font-size:.9rem;line-height:1}
.livemin.ms{color:var(--muted)}
.std th,.std td{padding:10px 9px}
.std th.l,.std td.l{text-align:left}
.std td.rank{padding-left:12px}
.std td.tm{font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.std td.sp{font-family:var(--display);font-size:1.3rem;font-weight:700}
.std tr.club td{background:var(--accent-soft);font-weight:700}
.livebar{display:grid;gap:6px;margin:0 0 12px}
.liverow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:.9rem}
.liverow .livemin{font-size:.9rem;min-height:0}
.lvdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px;animation:lvpulse 1.4s ease-in-out infinite}
@keyframes lvpulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.lvdot{animation:none}}
.std tr.livert td{background:color-mix(in srgb,var(--gold) 12%,transparent)}
.std tr.lv-w td{background:color-mix(in srgb,var(--win) 14%,transparent)}
.std tr.lv-l td{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.lvs-w{color:var(--win)!important}
.lvs-d{color:var(--gold)!important}
.lvs{color:var(--bad);font-weight:800;font-size:.72rem;margin-left:4px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media (max-width:520px){.tab{padding:8px 9px;font-size:.9rem;letter-spacing:.02em}.std .hm{display:none}.std th,.std td{padding:10px 6px}}
.cd{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);font-weight:700;font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.cd i{display:inline-block;width:11px;height:15px;border-radius:2.5px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.cd i.y{background:#f7c600}
.cd i.r{background:#e5392b}
p.state.live{margin:0}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;min-height:38px;border-top:1px solid var(--line);padding-top:12px}
.state{font-size:.86rem;color:var(--muted)}
.state.ok{color:var(--accent);font-weight:600} .state.warn{color:var(--bad);font-weight:600}
.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border:0;border-radius:12px;padding:10px 20px;font-weight:700;box-shadow:0 6px 16px rgba(18,184,134,.25)}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);box-shadow:none}
.pts{display:inline-block;background:var(--gold-bg);color:var(--gold);border-radius:999px;padding:3px 12px;font-family:var(--display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.pts.zero{background:var(--field);color:var(--muted)}
.pts.live{outline:1.5px dashed var(--bad);outline-offset:1px}
.others{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:7px 8px}
.pill{display:inline-flex;gap:7px;align-items:baseline;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.82rem}
.pill b{font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.pill .p{color:var(--gold);font-weight:800}

/* ---------- sıralama ---------- */
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:13px 14px;text-align:right;white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left;width:100%}
th:first-child,td:first-child{text-align:center}
thead th{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);font-weight:800}
tbody tr+tr td{border-top:1px solid var(--line)}
tbody tr.mine td{background:var(--accent-soft);font-weight:700}
td.rank{font-family:var(--display);font-size:1.2rem;font-weight:700;color:var(--muted)}
td.total{font-family:var(--display);font-size:1.6rem;font-weight:700}
.medal{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-family:var(--display);font-size:1.15rem;font-weight:700;color:#2a1c00}
.medal.m1{background:linear-gradient(140deg,#ffe08a,#e8a921)}
.medal.m2{background:linear-gradient(140deg,#f0f3f5,#aab4bd);color:#1c242a}
.medal.m3{background:linear-gradient(140deg,#f3c39b,#c4824a);color:#2b1704}

/* ---------- kurallar ve genel kutular ---------- */
.rules{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;font-size:.9rem;box-shadow:var(--shadow)}
.rules h3{font-size:1.15rem;letter-spacing:.1em;text-transform:uppercase}
.rules div{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.rules div b{font-family:var(--display);font-size:1.1rem;color:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:34px 20px;text-align:center;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.03em;min-width:0}
label input,label select{background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink);width:100%;min-width:0;font-weight:500}
label input:focus,label select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;align-self:flex-start;max-width:100%;overflow-x:auto}
.segb{background:none;border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:.85rem;color:var(--muted);white-space:nowrap}
.segb[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.codebox{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--gold-bg);border:1.5px dashed var(--gold);border-radius:16px;padding:14px 16px}
.code{font-family:var(--display);font-size:2.1rem;font-weight:700;letter-spacing:.14em;color:var(--gold);user-select:all}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .grow{flex:1}
.chipst{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.chipst.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chipst.wait{background:var(--gold-bg);color:var(--gold);border-color:transparent}
.adminrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.adminrow input{width:3.2rem;text-align:center;background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:8px;font-variant-numeric:tabular-nums}
.adminrow .grow{flex:1}
.pagefoot{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;font-size:.8rem;color:var(--muted)}
[hidden]{display:none!important}

/* ---------- sağ alttaki sohbet ---------- */
.chatfab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--accent-ink);background:linear-gradient(140deg,var(--accent),var(--accent2));box-shadow:0 14px 34px rgba(18,184,134,.42),0 2px 6px rgba(0,0,0,.25);z-index:60}
.chatfab:hover{transform:translateY(-2px) scale(1.03)}
.chatfab svg{width:28px;height:28px;grid-area:1/1}
.chatfab .i-close{display:none}
.chatfab[aria-expanded="true"] .i-chat{display:none}
.chatfab[aria-expanded="true"] .i-close{display:block}
.chatbadge{position:absolute;top:-5px;right:-5px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--bad);color:#fff;font-size:.74rem;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.chatpanel{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(92px + env(safe-area-inset-bottom));width:min(390px,calc(100vw - 32px));height:min(580px,calc(100dvh - 128px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-lg);overflow:hidden;z-index:60}
.chathead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent2))}
.chathead b{display:block;font-family:var(--display);font-size:1.4rem;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.chathead span{font-size:.78rem;opacity:.85}
.chatx{background:rgba(255,255,255,.2);border:0;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;color:inherit;font-size:1.2rem;line-height:1}
.chatbody{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.chatlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:0 16px 16px;background:var(--bg);overscroll-behavior:contain}
.chatlist .state{text-align:center;margin:auto}
.mrow{display:flex;align-items:center;gap:4px;align-self:flex-start;max-width:92%;min-width:0}
.mrow.mine{align-self:flex-end}
.msg{flex:0 1 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;overflow-wrap:anywhere;min-width:0;box-shadow:var(--shadow)}
.msg.mine{border-radius:16px 16px 4px 16px;border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink)}
.msg .who{font-family:var(--display);font-weight:700;font-size:1.02rem;letter-spacing:.03em}
.rxbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:6px}
.rx{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:2px 9px;font-size:.9rem;line-height:1.4}
.rx b{font-family:var(--display);font-size:.95rem;font-variant-numeric:tabular-nums}
button.rx{cursor:pointer}
.rx.mine{border-color:var(--accent);background:var(--accent-soft)}
.msg{transition:transform .35s ease,filter .35s ease}
.msg.pressing{transform:scale(.96);filter:brightness(.92)}
@keyframes rxpop{0%{transform:scale(.96)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
.msg.pop{animation:rxpop .28s ease-out}

<script>
(function(){
  var CFG=window.TAHMIN_CONFIG||{}, BASE=(CFG.SUPABASE_URL||"").replace(/\/+$/,""), KEY=CFG.SUPABASE_ANON_KEY||"";
  var TEAMS=[{key:"fb",name:"Fenerbahçe"},{key:"gs",name:"Galatasaray"},{key:"bjk",name:"Beşiktaş"}];
  var COMPS=["Süper Lig","Şampiyonlar Ligi","Avrupa Ligi","Konferans Ligi","Türkiye Kupası","Süper Kupa"];
  var EXACT=5, DIFF=3, SIDE=2;
  var ERR={
    invalid_image:"Görsel gönderilemedi, başka bir fotoğraf dene.",
    upload_failed:"Görsel yüklenemedi, tekrar dene.",
    invalid_nick:"Kullanıcı adı 2 ile 24 karakter arasında olmalı (< ve > kullanılamaz).",
    invalid_password:"Şifre en az 6 karakter olmalı.",
    wrong_credentials:"Kullanıcı adı ya da şifre yanlış.",
    locked:"Çok fazla yanlış deneme. 15 dakika sonra tekrar dene.",
    not_claimed:"Bu hesabı henüz kimse sahiplenmemiş. 'Kodum var' sekmesinden yöneticinin verdiği kodla şifre belirle.",
    name_taken:"Bu kullanıcı adı alınmış. 'Giriş yap' sekmesini dene ya da başka bir ad seç.",
    wrong_code:"Kod yanlış ya da bu kullanıcı için kod üretilmemiş.",
    already_claimed:"Bu hesap zaten sahiplenilmiş. 'Giriş yap' sekmesini kullan.",
    no_code:"Bu kullanıcı için kod üretilmemiş. Yöneticiden kod iste.",
    not_logged_in:"Oturumun doldu, tekrar giriş yap.",
    invalid_score:"Skor 0 ile 30 arasında olmalı.",
    no_match:"Bu maç artık yok.",
    closed:"Maç başladı, tahmin süresi doldu.",
    already_predicted:"Bu maça zaten tahmin girmişsin.",
    wrong_admin:"Yönetici şifresi yanlış.",
    too_fast:"Çok hızlı yazıyorsun, birkaç saniye bekle.",
    busy:"Şu an çok yoğun, biraz sonra tekrar dene.",
    invalid_body:"Mesaj 1 ile 300 karakter arasında olmalı."
  };

  var auth=null, adminPass=null, loading=true, loadError="";
  var BOT="uclu_tahmin_bot", tgLinked={};
  var matches=[], preds={}, players={}, lastSig="", prx={};
  var stand={}, standAt=0, standBusy=false, standSig="", euro="ucl";
  var tab="matches", filter="all", sub="up", drafts={}, flash={}, pendingDelete=null;
  var el=function(id){return document.getElementById(id)};
  var isAdmin=function(){return !!adminPass};

  /* ---------- depolama ve ağ ---------- */
  function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
  function ssGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
  function ssSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}
  function ssDel(k){try{sessionStorage.removeItem(k)}catch(e){}}

  async function sb(path,opts){
    var h={apikey:KEY,"Content-Type":"application/json"};
    if(KEY.indexOf("eyJ")===0)h.Authorization="Bearer "+KEY;
    var r=await fetch(BASE+path,Object.assign({headers:h},opts||{}));
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }
  function rpc(name,args){return sb("/rest/v1/rpc/"+name,{method:"POST",body:JSON.stringify(args)})}

  /* ---------- yardımcılar ---------- */
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function teamKey(n){var t=TEAMS.find(function(t){return t.name.toLowerCase()===String(n).trim().toLowerCase()});return t?t.key:""}
  /* cards verilirse (boş metin de olabilir) takım adının üstüne kart satırı konur. */
  function teamHtml(n,cls,cards){
    var k=teamKey(n);
    var inner='<div class="team '+(cls||"")+'">'+(cls==="away"?esc(n)+'<span class="dot '+k+'"></span>':'<span class="dot '+k+'"></span>'+esc(n))+'</div>';
    if(cards===undefined)return inner;
    return '<div class="teamwrap '+(cls||"")+'"><div class="cards">'+cards+'</div>'+inner+'</div>';
  }
  function cardsHtml(y,r){
    var h="";
    if(y>0)h+='<span class="cd" title="'+y+' sarı kart" aria-label="'+y+' sarı kart"><i class="y"></i>'+y+'</span>';
    if(r>0)h+='<span class="cd" title="'+r+' kırmızı kart" aria-label="'+r+' kırmızı kart"><i class="r"></i>'+r+'</span>';
    return h;
  }
  /* Gol ve kart olayları oyuncu adlarıyla: ev sahibi solda, deplasman sağda, zaman sırasıyla. */
  function evsHtml(m){
    if(!m.ev||!m.ev.length)return "";
    return '<div class="evs">'+m.ev.map(function(e){
      var ic=e.k==="yellow"?'<span class="cd"><i class="y"></i></span>':e.k==="red"?'<span class="cd"><i class="r"></i></span>':'<span class="gi">⚽</span>';
      var note=e.k==="own"?' (k.k.)':e.k==="pen"?' (P)':'';
      return '<div class="ev '+(e.s==="away"?"away":"home")+'">'+ic+'<b>'+esc(e.p||"?")+note+'</b><span class="min">'+esc(fmtMin(e.m))+'</span></div>';
    }).join("")+'</div>';
  }
  function fmtDate(ms){try{return new Date(ms).toLocaleString("tr-TR",{timeZone:"Europe/Istanbul",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
  var LOCK_MS=5*3600*1000;
  function started(m){return Date.now()>=m.kickoff}
  function closed(m){return Date.now()>=m.kickoff-LOCK_MS}
  function fmtTime(ms){try{return new Date(ms).toLocaleString("tr-TR",{timeZone:"Europe/Istanbul",hour:"2-digit",minute:"2-digit"})}catch(e){return ""}}
  function finished(m){return typeof m.hs==="number"&&typeof m.as==="number"}
  function sgn(n){return n>0?1:n<0?-1:0}
  /* Canlı skor: Raspberry her dakika yazar. 10 dakikadır güncellenmediyse eski sayılır. */
  function isLive(m){
    return !finished(m)&&typeof m.lh==="number"&&typeof m.la==="number"&&(m.lst==="live"||m.lst==="ht"||m.lst==="ft")&&started(m)&&Date.now()-m.lupd<10*60*1000;
  }
  /* Bitti diye işaretlenmiş ama kesin skoru henüz yazılmamış maç: son canlı skor geçici sonuç sayılır. */
  function provisional(m){return !finished(m)&&!isLive(m)&&started(m)&&m.lst==="ft"&&typeof m.lh==="number"&&typeof m.la==="number"}
  function effRes(m){
    if(finished(m))return {hs:m.hs,as:m.as,live:false};
    if(isLive(m)||provisional(m))return {hs:m.lh,as:m.la,live:true};
    return null;
  }
  function liveLabel(m){return m.lst==="ht"?"DEVRE ARASI":m.lst==="ft"?"MAÇ BİTTİ":"CANLI"}
  /* "45'+2'" ya da "45+2" gibi uzatma dakikalarını "45+2'" biçimine çevirir. */
  function fmtMin(s){
    s=String(s||"").trim();
    var x=s.match(/^(\d+)\s*'?\s*\+\s*(\d+)\s*'?$/);
    if(x)return x[1]+"+"+x[2]+"'";
    x=s.match(/^(\d+)\s*'?$/);
    if(x)return x[1]+"'";
    return s;
  }
  function liveMinute(m){return m.lst==="ht"?"Devre arası":m.lst==="ft"?"MS":fmtMin(m.lmin)}
  function score(p,m){
    var r=effRes(m);
    if(!p||!r)return null;
    if(p.h===r.hs&&p.a===r.as)return EXACT;
    if(sgn(p.h-p.a)!==sgn(r.hs-r.as))return 0;
    return (p.h-p.a===r.hs-r.as)?DIFF:SIDE;
  }
  function compCls(c){return {"Şampiyonlar Ligi":"ucl","Avrupa Ligi":"uel","Konferans Ligi":"uecl","Türkiye Kupası":"cup","Süper Kupa":"cup"}[c]||""}

        preds={};r[1].forEach(function(x){preds[x.match_id+"_"+x.player_id]={m:x.match_id,u:x.player_id,h:x.h,a:x.a}});

  function standLive(){return Object.keys(stand).some(function(k){return (stand[k].data||[]).some(function(r){return r.lv})})}
  /* Canlı maç varken 15 sn'de, yokken 60 sn'de bir yeniler. Veri değişmediyse sayfayı yeniden çizmez. */

  function boardHtml(){

        if(er0.ok){inp.value="";chatDraft="";chatErr="";editMsg=null;updateReplyPrev()}
        else{
          chatErr=er0.error==="too_late"?"Düzenleme süresi (15 dk) doldu.":er0.error==="not_found"?"Mesaj artık düzenlenemez.":(ERR[er0.error]||"Kaydedilemedi.");
          if(er0.error==="too_late"||er0.error==="not_found"){cancelEdit();updateReplyPrev()}
          if(er0.error==="not_logged_in"){auth=null;lsDel("tl_auth");chatFootKey="";render()}
        }
      }catch(e){chatErr="Bağlantı hatası, tekrar dene."}
      chatBusy=false;
      var b3=el("chatSend");if(b3)b3.disabled=false;
      var er3=el("chatErr");if(er3)er3.textContent=chatErr;
      await loadChat();updateChatUI(false);
      return;
    }
    try{
      var r;
      if(chatPend){
        var up=await uploadChatImg(chatPend.blob);
        r=up.ok?await rpc("send_chat_image",{p_token:auth.token,p_body:text,p_image:up.name,p_reply:replyTo?replyTo.id:null}):up;
      }else{
        var sargs={p_token:auth.token,p_body:text,p_reply:replyTo?replyTo.id:null};
        if(predQuote){sargs.p_pred_match=predQuote.m;sargs.p_pred_player=predQuote.u}
        r=await rpc("send_chat",sargs);
      }
      if(r.ok){inp.value="";chatDraft="";chatErr="";clearChatImg();replyTo=null;predQuote=null;updateReplyPrev()}
      else{
        chatErr=ERR[r.error]||"Gönderilemedi.";
        if(r.error==="not_logged_in"){auth=null;lsDel("tl_auth");chatFootKey="";render()}
      }
    }catch(e){chatErr="Bağlantı hatası, tekrar dene."}
    chatBusy=false;
    var b2=el("chatSend");if(b2)b2.disabled=false;
    var er=el("chatErr");if(er)er.textContent=chatErr;
    await loadChat();updateChatUI(true);
  }
  async function delChat(id){
    var r=await adminCall("admin_delete_chat",{p_id:+id});
    if(r&&r.ok)await loadChat();
  }

  /* ---------- işlemler ---------- */
  /* Giriş kutusu: giriş yap, üye ol ya da yöneticinin verdiği kodla hesabı sahiplen. */
  var loginMode="login";
  var HELP={
    login:"Şifreni unuttuysan yöneticiden yeni kod iste, sonra 'Kodum var' sekmesini kullan.",
    register:"Yeni üye ol: bir kullanıcı adı seç ve en az 6 karakterlik şifre belirle.",
    claim:"Daha önce sadece adını yazarak oynadıysan, yöneticinin verdiği kodla hesabını sahiplen ve yeni şifre belirle."
  };
  function setMode(m){
    loginMode=m;
    document.querySelectorAll(".segb").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.mode===m))});
    el("lblCode").hidden=m!=="claim";
    el("lblPass2").hidden=m==="login";
    el("loginBtn").textContent={login:"Giriş yap",register:"Üye ol",claim:"Şifre belirle ve gir"}[m];
    el("loginPass").setAttribute("autocomplete",m==="login"?"current-password":"new-password");
    el("lblPass").firstChild.nodeValue=m==="claim"?"Yeni şifre":"Şifre";
    el("loginHelp").textContent=HELP[m];
    el("loginMsg").textContent="";
  }
  async function doLogin(e){
    e.preventDefault();
    var nick=el("loginNick").value.trim(), pass=el("loginPass").value, msg=el("loginMsg"), btn=el("loginBtn");
    var fail=function(t){msg.className="state warn";msg.textContent=t;btn.disabled=false};
    if(nick.length<2)return fail(ERR.invalid_nick);
    if(!pass)return fail("Şifreni yaz.");
    var rname,args;
    if(loginMode==="login"){rname="member_login";args={p_nick:nick,p_password:pass}}
    else{
      if(pass!==el("loginPass2").value)return fail("İki şifre aynı değil.");
      if(pass.length<6)return fail(ERR.invalid_password);
      if(loginMode==="register"){rname="member_register";args={p_nick:nick,p_password:pass}}
      else{rname="member_claim";args={p_nick:nick,p_code:el("loginCode").value.trim(),p_password:pass}}
    }
    btn.disabled=true;msg.className="state";msg.textContent="Kontrol ediliyor…";
    try{
      var r=await rpc(rname,args);
      if(!r.ok)return fail(ERR[r.error]||"İşlem yapılamadı.");
      auth={id:r.id,nick:r.nick,token:r.token};lsSet("tl_auth",auth);msg.textContent="";
      el("loginPass").value="";el("loginPass2").value="";el("loginCode").value="";
      await load();render();
    }catch(err){return fail("Bağlantı hatası, tekrar dene.")}
    btn.disabled=false;
  }
  /* Telegram hatırlatması: oturum anahtarıyla 15 dakikalık tek kullanımlık kod alır, botu o kodla açar.
     Pencere, tıklamanın hemen içinde açılır ki telefon tarayıcıları açılır pencere engellemesin. */
  async function tgLink(){
    if(!auth)return;
    var w=null;try{w=window.open("","_blank")}catch(e){}
    var msg=el("tgMsg");if(msg)msg.textContent="";
    try{
      var r=await rpc("member_tg_code",{p_token:auth.token});
      if(r&&r.ok){
        var url="https://t.me/"+BOT+"?start="+r.code;
        if(w)w.location.href=url;else location.href=url;
        return;
      }
      if(w)w.close();
      if(r&&r.error==="not_logged_in"){auth=null;lsDel("tl_auth");chatFootKey="";render();return}
      if(msg)msg.textContent=" Kod alınamadı, tekrar dene.";
    }catch(e){if(w)w.close();if(msg)msg.textContent=" Bağlantı hatası, tekrar dene."}
  }
  async function doPw(e){
    e.preventDefault();
    var msg=el("pwMsg"),o=el("pwOld").value,n=el("pwNew").value;
    if(!auth)return;
    if(n.length<6){msg.className="state warn";msg.textContent=ERR.invalid_password;return}
    msg.className="state";msg.textContent="Kaydediliyor…";
    try{
      var r=await rpc("member_change_password",{p_token:auth.token,p_old:o,p_new:n});
      if(r.ok){msg.className="state ok";msg.textContent="Şifren değişti.";el("pwOld").value="";el("pwNew").value="";setTimeout(function(){el("pwbox").hidden=true;msg.textContent=""},1200)}
      else{msg.className="state warn";msg.textContent=r.error==="wrong_credentials"?"Şimdiki şifre yanlış.":(ERR[r.error]||"Değiştirilemedi.")}
    }catch(err){msg.className="state warn";msg.textContent="Bağlantı hatası."}
  }
  async function savePred(mid){
    if(!auth)return;
    var m=matches.find(function(x){return x.id===mid});if(!m||closed(m)||predFor(mid,auth.id))return;
    var d=drafts[mid]||{}, h=parseInt(d.h,10), a=parseInt(d.a,10);
    if(isNaN(h)||isNaN(a)||h<0||a<0||h>30||a>30)return;
    try{
      var r=await rpc("submit_prediction",{p_token:auth.token,p_match:mid,p_h:h,p_a:a});
      if(r.ok){delete drafts[mid];delete flash[mid]}
      else{
        flash[mid]=ERR[r.error]||"Kaydedilemedi.";if(r.error==="closed")flash[mid]="Tahmin süresi doldu (maçtan 5 saat önce kapanır).";
        if(r.error==="not_logged_in"){auth=null;lsDel("tl_auth");chatFootKey=""}
      }
    }catch(e){flash[mid]="Bağlantı hatası, tekrar dene."}
    await load();render();
  }
  async function adminCall(name,args){
    args.p_admin=adminPass;
    try{
      var r=await rpc(name,args);
      if(!r.ok&&r.error==="wrong_admin"){adminPass=null;ssDel("tl_admin");tab="matches";render()}
      return r;
    }catch(e){return {ok:false,error:"net"}}
  }
  async function addMatch(){
    var home=el("nm_home").value.trim(),away=el("nm_away").value.trim(),comp=el("nm_comp").value,t=el("nm_time").value,msg=el("nm_msg");
    if(!home||!away||!t){msg.textContent="Takımları ve başlama saatini doldur.";msg.className="state warn";return}
    var ms=Date.parse(t+":00+03:00");if(isNaN(ms)){msg.textContent="Saat geçersiz.";msg.className="state warn";return}
    var id="m"+ms+"-"+Math.random().toString(36).slice(2,6);
    var r=await adminCall("admin_upsert_match",{p_id:id,p_home:home,p_away:away,p_comp:comp,p_kickoff:new Date(ms).toISOString()});
    if(r.ok){await load();render();var m2=el("nm_msg");if(m2){m2.textContent="Maç eklendi.";m2.className="state ok"}}
    else{msg.textContent="Eklenemedi.";msg.className="state warn"}
  }
  async function saveResult(mid){
    var h=parseInt(el("rh_"+mid).value,10),a=parseInt(el("ra_"+mid).value,10);
    if(isNaN(h)||isNaN(a)||h<0||a<0)return;
    await adminCall("admin_set_result",{p_id:mid,p_hs:h,p_as:a});await load();render();
  }
  async function clearResult(mid){await adminCall("admin_set_result",{p_id:mid,p_hs:null,p_as:null});await load();render()}
  async function delMatch(mid){
    if(pendingDelete!==mid){pendingDelete=mid;render();setTimeout(function(){if(pendingDelete===mid){pendingDelete=null;render()}},4000);return}
    pendingDelete=null;await adminCall("admin_delete_match",{p_id:mid});await load();render();
  }
  async function doAdminLogin(e){
    e.preventDefault();
    var pw=el("adminPass").value,msg=el("adminMsg");msg.className="state";msg.textContent="Kontrol ediliyor…";
    try{
      var r=await rpc("admin_check",{p_admin:pw});
      if(r.ok){adminPass=pw;ssSet("tl_admin",pw);el("adminbox").hidden=true;el("adminPass").value="";msg.textContent="";tab="admin";render();loadAdminPlayers()}
      else{msg.className="state warn";msg.textContent=ERR.wrong_admin}
    }catch(err){msg.className="state warn";msg.textContent="Bağlantı hatası."}
  }

  /* ---------- olaylar ---------- */
  /* Telefonda mesaja basılı tutunca tepki seçici açılır (WhatsApp gibi). */
  /* Titreşim: Android'de navigator.vibrate; iPhone'da yok, bunun yerine gizli bir "switch" kutusuna dokunmak iOS'ta hafif titreşim verir (iOS 17.4+). */
  var hapticLbl=null;
  function haptic(){
    try{
      if(navigator.vibrate){navigator.vibrate(30);return}
      if(!hapticLbl){
        hapticLbl=document.createElement("label");hapticLbl.setAttribute("aria-hidden","true");
        hapticLbl.style.cssText="position:fixed;left:-200px;top:0;opacity:0;pointer-events:none";
        hapticLbl.innerHTML='<input type="checkbox" switch tabindex="-1">';document.body.appendChild(hapticLbl);
      }
      hapticLbl.click();
    }catch(_){}
  }
  var lpTimer=0,lpX=0,lpY=0,lpAt=0;
  var lpPress=0,lpEl=null;
  function lpUnpress(){if(lpPress){clearTimeout(lpPress);lpPress=0}if(lpEl){lpEl.classList.remove("pressing");lpEl=null}}
  function lpCancel(){if(lpTimer){clearTimeout(lpTimer);lpTimer=0}lpUnpress()}
  document.addEventListener("touchstart",function(e){
    lpCancel();
    if(!auth||e.touches.length!==1)return;
    var msg=e.target.closest&&e.target.closest(".msg[data-mid]");
    if(!msg||e.target.closest("button,a,.rxpick,.rxgrid"))return;
    lpX=e.touches[0].clientX;lpY=e.touches[0].clientY;
    lpPress=setTimeout(function(){lpPress=0;lpEl=msg;msg.classList.add("pressing")},150);
    lpTimer=setTimeout(function(){
      lpTimer=0;lpAt=Date.now();lpUnpress();
      var id=+msg.dataset.mid;rxOpen=id;rxFull=0;updateChatUI(false);
      var nm=document.querySelector('.msg[data-mid="'+id+'"]');if(nm){nm.classList.add("pop");setTimeout(function(){nm.classList.remove("pop")},400)}
      haptic();
    },450);
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if(lpTimer&&e.touches[0]&&(Math.abs(e.touches[0].clientX-lpX)>10||Math.abs(e.touches[0].clientY-lpY)>10))lpCancel();
  },{passive:true});
  ["touchend","touchcancel","scroll"].forEach(function(n){document.addEventListener(n,lpCancel,{passive:true,capture:true})});
  document.addEventListener("contextmenu",function(e){
    if(auth&&e.target.closest&&e.target.closest(".msg[data-mid]")&&matchMedia("(pointer:coarse)").matches)e.preventDefault();
  });
  /* Telefonda bir tahmine basılı tutunca (sohbetteki mesajlar gibi) tepki ve alıntı penceresi açılır. Bilgisayarda tıklamak yeter. */
  var ppTimer=0,ppPress=0,ppEl=null,ppX=0,ppY=0;
  function ppCancel(){
    if(ppTimer){clearTimeout(ppTimer);ppTimer=0}
    if(ppPress){clearTimeout(ppPress);ppPress=0}
    if(ppEl){ppEl.classList.remove("pressing");ppEl=null}
  }
  document.addEventListener("touchstart",function(e){
    ppCancel();
    if(e.touches.length!==1)return;
    var pill=e.target.closest&&e.target.closest('button.pill[data-action="predopen"]');
    if(!pill)return;
    ppX=e.touches[0].clientX;ppY=e.touches[0].clientY;
    ppPress=setTimeout(function(){ppPress=0;pill.classList.add("pressing");ppEl=pill},150);
    ppTimer=setTimeout(function(){
      ppTimer=0;pill.classList.remove("pressing");ppEl=null;
      pill.classList.add("pop");setTimeout(function(){pill.classList.remove("pop")},400);
      openPredSheet(pill.dataset.m,pill.dataset.u);haptic();
    },450);
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if((ppTimer||ppPress)&&e.touches[0]&&(Math.abs(e.touches[0].clientX-ppX)>10||Math.abs(e.touches[0].clientY-ppY)>10))ppCancel();
  },{passive:true});
  ["touchend","touchcancel","scroll"].forEach(function(n){document.addEventListener(n,ppCancel,{passive:true,capture:true})});
  document.addEventListener("contextmenu",function(e){
    if(e.target.closest&&e.target.closest('button.pill[data-action="predopen"]')&&matchMedia("(pointer:coarse)").matches)e.preventDefault();
  });
  /* Telefonda mesajı sağa kaydırınca yanıtlanır (WhatsApp gibi). */
  var swEl=null,swX=0,swY=0,swDx=0,swOn=false;
  function swReset(){if(swEl){swEl.style.transition="";swEl.style.transform=""}swEl=null;swOn=false;swDx=0}
  document.addEventListener("touchstart",function(e){
    swReset();
    if(!auth||e.touches.length!==1)return;
    var msg=e.target.closest&&e.target.closest(".msg[data-mid]");
    if(!msg||e.target.closest("button,a,.rxpick,.rxgrid"))return;
    swEl=msg;swX=e.touches[0].clientX;swY=e.touches[0].clientY;
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if(!swEl||!e.touches[0])return;
    var dx=e.touches[0].clientX-swX, dy=e.touches[0].clientY-swY;
    if(!swOn){
      if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){swReset();return}
      if(dx>14&&dx>Math.abs(dy)*1.5){swOn=true;swEl.style.transition="none"}
    }
    if(swOn){swDx=Math.max(0,Math.min(dx,80));swEl.style.transform="translateX("+swDx+"px)"}
  },{passive:true});
  document.addEventListener("touchend",function(){
    if(swEl&&swOn&&swDx>=56){var id=+swEl.dataset.mid;swReset();setReply(id);haptic()}
    else swReset();
  },{passive:true});
  document.addEventListener("touchcancel",swReset,{passive:true});
  /* Seçici açıkken dışına dokununca kapanır. */
  document.addEventListener("click",function(e){
    if(!rxOpen||Date.now()-lpAt<700)return;
    if(e.target.closest(".rxpick,.rxgrid,.rxadd,[data-action=react],[data-action=rxmore],.rxsheetbg"))return;
    rxOpen=0;rxFull=0;updateChatUI(false);
  });

  document.addEventListener("click",function(e){
    var t=e.target.closest("[data-tab],[data-sub],[data-euro],[data-mode],[data-filter],[data-action]");if(!t)return;
    if(t.dataset.tab){tab=t.dataset.tab;render();if(tab==="admin")loadAdminPlayers();return}
    if(t.dataset.mode){setMode(t.dataset.mode);return}
    if(t.dataset.euro){euro=t.dataset.euro;render();return}
    if(t.dataset.sub){sub=t.dataset.sub;render();return}
    if(t.dataset.filter){filter=t.dataset.filter;render();return}
    var a=t.dataset.action,m=t.dataset.m;
    if(a==="sendChat")sendChat();
    else if(a==="pickImg"){var fi=el("chatFile");if(fi)fi.click()}
    else if(a==="pickCam"){if(window.matchMedia&&matchMedia("(pointer:coarse)").matches){var fc=el("chatCam");if(fc)fc.click()}else openWebcam()}
    else if(a==="clearImg")clearChatImg();
    else if(a==="zoom")openLightbox(t.getAttribute("src"));
    else if(a==="rxwho")openRxSheet(+t.dataset.id);
    else if(a==="react")reactChat(+t.dataset.id,t.dataset.kind);
    else if(a==="rxpick"){var pm=+t.dataset.id;rxOpen=rxOpen===pm?0:pm;rxFull=0;updateChatUI(false)}
    else if(a==="rxmore"){var fm=+t.dataset.id;rxFull=rxFull===fm?0:fm;updateChatUI(false)}
    else if(a==="reply")setReply(+t.dataset.id);
    else if(a==="clearReply"){if(editMsg)cancelEdit();replyTo=null;predQuote=null;updateReplyPrev()}
    else if(a==="chatDown"){var cb=el("chatlist");if(cb){chatProg=Date.now();cb.scrollTo({top:cb.scrollHeight,behavior:"smooth"})}}
    else if(a==="predopen"){if(!matchMedia("(pointer:coarse)").matches)openPredSheet(t.dataset.m,t.dataset.u)}
    else if(a==="gotoMatch")gotoMatch(t.dataset.m);
    else if(a==="editMsg")startEdit(+t.dataset.id);
    else if(a==="delMsg")delMsg(+t.dataset.id);
    else if(a==="goto")gotoMsg(+t.dataset.id);
    else if(a==="readers")openReadSheet(+t.dataset.id);
    else if(a==="delChat")delChat(t.dataset.id);
    else if(a==="savePred")savePred(m);
    else if(a==="signout"){var tk=auth&&auth.token;auth=null;lsDel("tl_auth");chatFootKey="";el("pwbox").hidden=true;setMode("login");render();if(tk)rpc("member_logout",{p_token:tk}).catch(function(){})}
    else if(a==="tgLink")tgLink();
    else if(a==="showPw"){el("pwbox").hidden=false;el("pwOld").focus()}
    else if(a==="resetPlayer")resetPlayer(t.dataset.id);
    else if(a==="hideCode"){newCode=null;render()}
    else if(a==="copyCode"){
      if(newCode){var cb=t;try{navigator.clipboard.writeText(newCode.code).then(function(){cb.textContent="Kopyalandı"},function(){cb.textContent="Kopyalanamadı"})}catch(err){cb.textContent="Kopyalanamadı"}}
    }
    else if(a==="addMatch")addMatch();
    else if(a==="saveResult")saveResult(m);
    else if(a==="clearResult")clearResult(m);
    else if(a==="delMatch")delMatch(m);
  });
  document.addEventListener("input",function(e){
    var t=e.target;if(!t.dataset||!t.dataset.m||!t.dataset.side)return;
    var d=drafts[t.dataset.m]||(drafts[t.dataset.m]={});d[t.dataset.side]=t.value;delete flash[t.dataset.m];
    var h=d.h===undefined?"":d.h,a=d.a===undefined?"":d.a;
    var btn=document.querySelector('[data-action="savePred"][data-m="'+t.dataset.m+'"]');
    if(btn)btn.disabled=!(h!==""&&a!==""&&+h>=0&&+a>=0&&+h<=30&&+a<=30);
  });
  document.addEventListener("input",function(e){if(e.target&&e.target.id==="chatInput"){chatDraft=e.target.value;if(chatDraft.trim())sendTyping()}});
  setInterval(function(){if(!document.hidden&&chatOpen)loadTyping()},2000);
  document.addEventListener("change",function(e){var t=e.target;if(t&&(t.id==="chatFile"||t.id==="chatCam")){var f=t.files&&t.files[0];t.value="";pickChatImg(f)}});
  /* Görsel yüklenince yükseklik değişir: en alttaysak yeniden en alta kaydır. */
  document.addEventListener("load",function(e){var t=e.target;if(t&&t.classList&&t.classList.contains("chatimg")&&Date.now()<chatStickUntil){var box=el("chatlist");if(box){chatProg=Date.now();box.scrollTop=box.scrollHeight}}},true);
  document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target&&e.target.id==="chatInput"){e.preventDefault();sendChat()}});
  /* Sohbet açıkken 4 saniyede bir, değilken 20 saniyede bir kontrol et (okunmamış sayısı için). */
  setInterval(function(){
    if(document.hidden)return;
    chatTick++;
    if(chatOpen||chatTick%5===0)loadChat();
  },4000);
  el("chatlist").addEventListener("scroll",onChatScroll,{passive:true});
  if(window.visualViewport){visualViewport.addEventListener("resize",fitChat);visualViewport.addEventListener("scroll",fitChat)}
  el("chatFab").addEventListener("click",function(){setChatOpen(!chatOpen)});
  el("chatClose").addEventListener("click",function(){setChatOpen(false);el("chatFab").focus()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&chatOpen){setChatOpen(false);el("chatFab").focus()}});
  el("loginbox").addEventListener("submit",doLogin);
  el("pwbox").addEventListener("submit",doPw);
  el("pwCancel").addEventListener("click",function(){el("pwbox").hidden=true});
  el("adminbox").addEventListener("submit",doAdminLogin);
  el("adminLink").addEventListener("click",function(){el("adminbox").hidden=false;el("adminPass").focus()});
  el("adminCancel").addEventListener("click",function(){el("adminbox").hidden=true});
  el("adminOut").addEventListener("click",function(){adminPass=null;ssDel("tl_admin");tab="matches";render()});
  /* Canlı maç varken 15 saniyede bir, yoksa 30 saniyede bir yenile. */
  setInterval(function(){if((tab==="super"||tab==="euro")&&!document.hidden)ensureStandings()},5000);
  (function tick(){
    var a=document.activeElement;
    if(BASE&&KEY&&!document.hidden&&!(a&&a.tagName==="INPUT"))load();
    setTimeout(tick,matches.some(isLive)?15000:30000);
  })();

  /* ---------- başlangıç ---------- */
  var saved=lsGet("tl_auth");if(saved&&saved.id&&saved.nick&&saved.token)auth={id:saved.id,nick:saved.nick,token:saved.token};
  var sa=ssGet("tl_admin");if(sa)adminPass=sa;
  setMode("login");
  render();
  if(BASE&&KEY){
    load();loadChat();
    /* Kayıtlı oturum hâlâ geçerli mi? Değilse (süresi dolmuş, şifre sıfırlanmış) çıkış yaptır. */
    if(auth)rpc("member_me",{p_token:auth.token}).then(function(r){
      if(r&&r.ok){auth.nick=r.nick}
      else if(r&&r.error==="not_logged_in"){auth=null;lsDel("tl_auth");chatFootKey="";render()}
    }).catch(function(){});
  }else loading=false,render();
})();
</script>
</body>
